function render(){
 const codes=D.tops[base],S=D.stocks;
 document.getElementById('hd').textContent=`기준일 ${fmt(D.base_dt)} · 생성 ${D.generated} · MACD(${D.params.join(',')}) 일봉 · 유니버스: 최근 ${D.flow_days}거래일 ${D.bases[base]} 순매수 상위 ${D.topn}종목`;
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=Object.entries(D.bases).map(([k,v])=>`<button class="${k===base?'on':''}" data-k="${k}">${v}</button>`).join('');
 tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{base=b.dataset.k;render()});
 const avail=codes.filter(c=>S[c]);
 const flow=c=>S[c].frgn+S[c].orgn;
 const gold=avail.filter(c=>S[c].cross.state==='g').sort((a,b)=>S[b].cross.days-S[a].cross.days||flow(b)-flow(a));
 const dead=avail.filter(c=>S[c].cross.state==='d').sort((a,b)=>S[b].cross.days-S[a].cross.days||flow(b)-flow(a));
 const ph={1:[],2:[],3:[],4:[]};avail.forEach(c=>ph[S[c].phase].push(c));
 const ev=k=>avail.filter(c=>S[c].ev.includes(k)).sort((a,b)=>Math.abs(S[b].hist)-Math.abs(S[a].hist));
 // ── 국면 4분면 ──
 document.getElementById('phases').innerHTML=[1,2,3,4].map(p=>{const inflow=ph[p].filter(c=>S[c].prev_phase&&S[c].prev_phase!==p).length;
  return `<div class="ph p${p}" data-p="${p}"><b>${ph[p].length}</b><span>${PH[p][0]} <small style="display:inline">· ${PH[p][1]}</small></span><small>오늘 진입 ${inflow}종목 · ${(ph[p].length/Math.max(1,avail.length)*100).toFixed(0)}%</small></div>`}).join('');
 document.querySelectorAll('.ph').forEach(el=>el.onclick=()=>{const p=+el.dataset.p;if(p<=2){gfilt=p===1?'a':'b';document.getElementById('gold').scrollIntoView({behavior:'smooth',block:'start'})}else{dfilt=p===3?'a':'b';document.getElementById('dead').scrollIntoView({behavior:'smooth',block:'start'})}renderTables()});
 // ── 오늘의 시그널 ──
 const tk=(c,k)=>`<span class="tk ${S[c].hist>=S[c].hist_prev?'up':'dn'}" title="${S[c].sector} · 히스토 ${S[c].hist}%">${S[c].name}<i>${S[c].chg>0?'+':''}${S[c].chg}%</i></span>`;
 document.getElementById('sig').innerHTML=['gc','bt','zu','dc','tt','zd'].map(k=>{const l=ev(k);
  return `<div class="sbox"><h3 title="${EV[k][1]}"><b>${l.length}</b>${EV[k][0]}</h3><div class="lst">${l.length?l.map(c=>tk(c,k)).join(''):'<span class="none">해당 없음</span>'}</div></div>`}).join('');
 drawChart();
 // ── 오늘의 요약 ──
 (function(){
  const el=document.getElementById('brief');
  if(!avail.length){el.innerHTML='<div class="bt">📝 오늘의 요약</div><p>분석 가능한 종목이 없습니다.</p>';return}
  const bySec={};ph[1].forEach(c=>{const k=S[c].sector||'기타';(bySec[k]=bySec[k]||[]).push(c)});
  const gs=Object.entries(bySec).map(([g,l])=>({g,l:l.sort((a,b)=>S[b].cross.days-S[a].cross.days)})).sort((a,b)=>b.l.length-a.l.length);
  const [g1,g2]=gs;
  const b=D.breadth[base]||[],nb=b.length,d5=nb>5?b[nb-1][1]-b[nb-6][1]:0,z5=nb>5?b[nb-1][2]-b[nb-6][2]:0;
  const gc=ev('gc'),dc=ev('dc'),bt=ev('bt'),zu=ev('zu');
  const nmL=(l,n)=>l.slice(0,n).map(c=>S[c].name).join(' · ');
  const gpct=(gold.length/avail.length*100).toFixed(0);
  let h=`<div class="bt">📝 오늘의 요약 <span style="font-weight:600;color:var(--sub)">${fmt(D.base_dt)} 종가 · ${D.bases[base]} 수급 상위 ${D.topn} 기준 자동 생성</span></div>`;
  h+=`<p>유니버스 ${avail.length}종목 중 골든크로스 <b>${gold.length}종목(${gpct}%)</b>, 그중 0선 위 강세 국면 <b>${ph[1].length}</b>·0선 아래 회복 국면 <b>${ph[2].length}</b>. 데드크로스 ${dead.length}종목(조정 ${ph[3].length}·약세 ${ph[4].length}). `+
   (d5>0?`최근 5거래일 골든크로스 종목이 <b>+${d5}</b> 늘었고`:d5<0?`최근 5거래일 골든크로스 종목이 <b>${d5}</b> 줄었고`:`최근 5거래일 골든크로스 종목수는 정체이고`)+
   (z5>0?` 0선 위 종목도 <b>+${z5}</b> 확산 중.`:z5<0?` 0선 위 종목은 <b>${z5}</b> 축소 중.`:` 0선 위 종목수는 정체.`)+`</p>`;
  if(g1)h+=`<p>강세 국면의 무게중심은 <b>${g1.g}</b>(${g1.l.length}종목${g2?`)과 <b>${g2.g}</b>(${g2.l.length}종목`:''}). 골든크로스 최장수는 <b>${S[gold[0]].name}</b>(${S[gold[0]].sector}) <b>${S[gold[0]].cross.days}거래일</b>.</p>`;
  if(gc.length)h+=`<p>오늘 골든크로스 발생 <b>${nmL(gc,6)}</b>${gc.length>6?` 등 ${gc.length}종목`:` ${gc.length}종목`}${zu.length?`, 0선 상향 돌파 <b>${nmL(zu,4)}</b>${zu.length>4?` 등 ${zu.length}종목`:''}`:''}.</p>`;
  if(bt.length)h+=`<p>히스토그램 바닥 반전(골든크로스 선행 후보) <b>${nmL(bt,6)}</b>${bt.length>6?` 등 ${bt.length}종목`:` ${bt.length}종목`} — 음수 히스토그램이 저점을 찍고 첫 상승. 아직 데드 상태이니 확인 매매.</p>`;
  if(dc.length)h+=`<p>오늘 데드크로스 <b>${nmL(dc,5)}</b>${dc.length>5?` 등 ${dc.length}종목`:` ${dc.length}종목`} — 하단 데드크로스 테이블에서 직전 골든 유지일을 확인.</p>`;
  h+=`<div class="gchips">`+gs.slice(0,10).map(o=>`<span class="gchip">${o.g} <b>${o.l.length}</b> <span class="tks">${o.l.slice(0,2).map(c=>`${S[c].name} ${S[c].cross.days}일`).join(' · ')}${o.l.length>2?' …':''}</span></span>`).join('')+`</div>`;
  el.innerHTML=h;
 })();
 window._lists={gold,dead};
 renderTables();
 document.getElementById('note').innerHTML=`MACD = EMA${D.params[0]}(종가) − EMA${D.params[1]}(종가), 시그널 = EMA${D.params[2]}(MACD), 히스토그램 = MACD − 시그널 (일봉 수정주가). 표시값은 <b>종가 대비 %</b>(MACD÷종가×100)로 정규화해 종목 간 비교 가능. 국면: ①강세=골든·0선 위 ②회복=골든·0선 아래 ③조정=데드·0선 위 ④약세=데드·0선 아래. 히스토 방향 = 히스토그램이 연속으로 상승(+)/하락(−)한 거래일 수. 막대 = 최근 40거래일 히스토그램. 유니버스 = 최근 ${D.flow_days}거래일 투자자 순매수 누적 상위 ${D.topn}(매일 재산정, 정배열 트래커와 동일). 순매수 단위: 억원.`;
}
function renderTables(){
 const S=D.stocks,{gold,dead}=window._lists;
 const fb=(id,cur,opts,set)=>{const el=document.getElementById(id);el.innerHTML=opts.map(([k,v])=>`<button class="${cur===k?'on':''}" data-k="${k}">${v}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{set(b.dataset.k);renderTables()})};
 fb('gf',gfilt,[['all','전체'],['a','0선 위 (강세)'],['b','0선 아래 (회복)'],['new','5일 내 교차']],k=>gfilt=k);
 fb('df',dfilt,[['all','전체'],['a','0선 위 (조정)'],['b','0선 아래 (약세)'],['new','5일 내 교차']],k=>dfilt=k);
 const ap=(l,f)=>l.filter(c=>f==='all'||(f==='new'?S[c].cross.days<=5:S[c].zero.state===f));
 const row=(c,i)=>{const s=S[c],st=s.cross;
  const newb=s.hist_len<120?`<span class="badge b-new">신규 ${s.hist_len}일</span>`:'';
  const enter=st.days===1?`<span class="badge b-enter">NEW</span>`:'';
  const zb=s.zero.days===1?`<span class="badge b-z">0선 ${s.zero.state==='a'?'돌파':'이탈'}</span>`:'';
  return `<tr><td>${i+1}</td><td><span class="nm">${s.name}</span><span class="code">${c}</span><span class="mkt"> ${s.market==='KOSPI'?'KP':'KQ'}</span>${newb}${enter}${zb}</td>`+
   `<td><span class="pb pb${s.phase}">${PH[s.phase][0]}</span></td><td>${fmt(st.since)}</td><td class="days">${st.days}일</td>`+
   `<td>${s.zero.state==='a'?'▲':'▼'} ${s.zero.days}일</td><td>${comma(s.close)}</td><td>${pc(s.chg)}</td><td>${pc(s.macd)}</td><td>${pc(s.hist)}</td>`+
   `<td class="sp" title="최근 40거래일 히스토그램">${spark(s.spark)}</td><td class="${s.hdir>=0?'pos':'neg'}">${s.hdir>0?'↑':'↓'}${Math.abs(s.hdir)}일</td>`+
   `<td class="${s.frgn>=0?'pos':'neg'}">${comma(s.frgn)}</td><td class="${s.orgn>=0?'pos':'neg'}">${comma(s.orgn)}</td></tr>`;};
 const head='<tr><th>#</th><th>종목</th><th>국면</th><th>교차일</th><th>유지</th><th>0선</th><th>현재가</th><th>등락</th><th>MACD%</th><th>히스토%</th><th>히스토그램 40일</th><th>히스토 방향</th><th>외인20일</th><th>기관20일</th></tr>';
 const tbl=l=>l.length?`<table>${head}${l.map(row).join('')}</table>`:'<div class="empty">해당 없음</div>';
 document.getElementById('gold').innerHTML=tbl(ap(gold,gfilt));
 document.getElementById('dead').innerHTML=tbl(ap(dead,dfilt));
}
/* 추이 차트 접기 토글 — 기본 접힘 (localStorage 기억) */
const chartHead=document.getElementById('chartHead'),chartBody=document.getElementById('chartBody');
let chartOpen=false;try{chartOpen=localStorage.getItem('macd-chart')==='1'}catch(e){}
function setChart(o){chartOpen=o;chartBody.hidden=!o;chartHead.querySelector('.arr').textContent=o?'▾ 접기':'▸ 펼치기';
 try{localStorage.setItem('macd-chart',o?'1':'0')}catch(e){}
 if(o)setTimeout(drawChart,0);}
chartHead.onclick=()=>setChart(!chartOpen);
function drawChart(){
 if(chartBody.hidden)return;
 const b=D.breadth[base]||[],el=document.getElementById('chart');
 if(b.length<2){el.innerHTML='';return}
 const W=el.clientWidth||900,H=130,P=28;
 const max=Math.max(5,...b.map(r=>Math.max(r[1],r[2])));
 const x=i=>P+(W-P-10)*i/(b.length-1),y=v=>H-16-(H-30)*v/max;
 const line=k=>b.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join('');
 let ticks='';
 for(let i=0;i<b.length;i+=Math.ceil(b.length/6))
  ticks+=`<text x="${x(i)}" y="${H-2}" fill="#6e7681" font-size="9" text-anchor="middle">${b[i][0].slice(4,6)}/${b[i][0].slice(6)}</text>`;
 const L=b[b.length-1];
 el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">
  <text x="${P-4}" y="${y(max)+3}" fill="#6e7681" font-size="9" text-anchor="end">${max}</text>
  <text x="${P-4}" y="${y(0)+3}" fill="#6e7681" font-size="9" text-anchor="end">0</text>
  <line x1="${P}" y1="${y(0)}" x2="${W-10}" y2="${y(0)}" stroke="#21262d"/>
  <path d="${line(1)}" fill="none" stroke="#3fb950" stroke-width="1.6"/>
  <path d="${line(2)}" fill="none" stroke="#f85149" stroke-width="1.6"/>
  <text x="${W-10}" y="${y(L[1])-4}" fill="#3fb950" font-size="10" text-anchor="end">골든 ${L[1]}</text>
  <text x="${W-10}" y="${y(L[2])+12}" fill="#f85149" font-size="10" text-anchor="end">0선 위 ${L[2]}</text>
  ${ticks}</svg>`;
}
setChart(chartOpen);
render();
addEventListener('resize',drawChart);
</script></body></html>
