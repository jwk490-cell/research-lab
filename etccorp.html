<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기타법인 수급</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--txt:#e6edf3;--sub:#8b949e;--faint:#6e7681;
--red:#f85149;--org:#ffa657;--grn:#3fb950;--blu:#58a6ff;--pur:#bc8cff;--yel:#d29922;--teal:#39d3bb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;padding:18px 20px 60px}
.wrap{max-width:1360px;margin:0 auto}
h1{font-size:19px;margin-bottom:2px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.sub b{color:var(--txt)}
.sub .prov{color:var(--sub);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:130px;cursor:pointer}
.chip.on{border-color:var(--blu);background:#13233a}
.chip b{display:block;font-size:19px;line-height:1.15}
.chip span{font-size:11px;color:var(--sub)}
.chip small{display:block;font-size:10.5px;color:var(--faint)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .lb{font-size:11px;color:var(--faint);margin-right:-4px}
.bar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;width:170px}
.filt{display:flex;gap:4px;flex-wrap:wrap}
.filt button{background:var(--card);border:1px solid var(--line);color:var(--sub);font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer}
.filt button.on{color:var(--txt);border-color:var(--blu);background:#13233a}
label.ck{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer}
.tw{overflow-x:auto;margin-bottom:22px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
th{color:var(--faint);font-weight:600;font-size:11px;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;vertical-align:bottom}
th.l,td.l{text-align:left}
th.s{color:var(--blu)}
th small{display:block;font-weight:400;font-size:10px;color:var(--faint)}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:#1c2129}
tbody tr.row.sel td{background:#13233a}
tr.det td{background:#0f1319;padding:12px 14px 14px;white-space:normal;cursor:default}
.nm{font-weight:600}
.cd{color:var(--faint);font-size:11px;margin-left:5px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin-left:4px;vertical-align:1px}
.tag.new,.tag.d5{color:var(--blu);border-color:#1f3a5a}.tag.bb,.tag.dm{color:var(--sub);border-color:var(--line)}
.g{color:var(--grn)}.r{color:var(--red)}.o{color:var(--org)}.b{color:var(--blu)}.f{color:var(--faint)}.y{color:var(--yel)}.p{color:var(--pur)}
.rk{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 5px;font-size:11.5px;background:#1c2129;color:var(--sub)}
.rk.top{background:#13233a;color:var(--blu);font-weight:600}
.det .grid{display:grid;grid-template-columns:minmax(380px,1.3fr) minmax(300px,1fr);gap:16px}
@media(max-width:900px){.det .grid{grid-template-columns:1fr}}
.det h4{font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.det table{font-size:11.5px;background:transparent;border:0}
.det th{cursor:default;padding:3px 7px}
.det td{padding:3px 7px}
.det .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;margin-bottom:10px}
.det .kv span{color:var(--faint)}
.det a{color:var(--blu);text-decoration:none}
.det ul{list-style:none;font-size:12px;margin-bottom:10px}
.det li{padding:2px 0}
.det svg{width:100%;height:200px;display:block;margin-bottom:8px}
.det svg text{fill:var(--faint);font-size:10px}
.det .bpos{fill:#4ea1ff}.det .bneg{fill:#f85149}.det .bout{fill:#2b3340}
.det .px{stroke:var(--sub);stroke-width:1.4;fill:none}
.det .ax{stroke:var(--line)}
.det .dtt td{white-space:nowrap}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:12.5px;color:var(--sub);line-height:1.7}
.note b{color:var(--txt)}
.note h3{font-size:13px;color:var(--txt);margin:0 0 6px}
.note ul{padding-left:18px}
.empty{padding:26px;text-align:center;color:var(--faint)}
.today{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blu);border-radius:10px;padding:12px 16px 10px;margin-bottom:14px;font-size:12.5px;line-height:1.7}
.today h3{font-size:13px;color:var(--txt);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.today h3 small{font-size:11px;color:var(--faint);font-weight:400}
.today .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.today .lb2{flex:none;font-size:11px;color:var(--faint);min-width:96px}
.today .st{display:inline-flex;align-items:baseline;gap:4px;background:#1c2129;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;color:var(--txt);white-space:nowrap}
.today .st:hover{border-color:var(--blu)}
.today .st small{color:var(--faint);font-size:10.5px}
.today .st.bb{color:var(--sub)}
.today .dim{color:var(--faint)}
.today .sec{margin-top:7px;padding-top:5px;border-top:1px dashed var(--line)}
.today .sec h4{font-size:12px;color:var(--sub);margin-bottom:3px}
.today .sec h4 small{font-weight:400;color:var(--faint);font-size:10.5px;margin-left:5px}
.cnt{font-size:11.5px;color:var(--faint);margin-left:auto}
</style></head><body><div class="wrap">
<h1>기타법인 수급</h1>
<div class="sub" id="hd">불러오는 중…</div>
<div class="today" id="today"></div>
<div class="chips" id="chips"></div>

<div class="bar">
  <span class="lb">보기</span><div class="filt" id="vm"></div>
  <span class="lb">최소 연속</span><div class="filt" id="sk"></div>
  <span class="lb">최소 누적</span><div class="filt" id="am"></div>
  <span class="lb">시장</span><div class="filt" id="mf"></div>
  <span class="lb">시총</span><div class="filt" id="cf"></div>
</div>
<div class="bar">
  <span class="lb">정렬</span><div class="filt" id="sf"></div>
  <label class="ck"><input type="checkbox" id="xbb" checked> 자사주로 설명되는 종목(≥70%) 제외</label>
  <label class="ck"><input type="checkbox" id="onlyd"> 지분공시 있는 종목만</label>
  <input type="text" id="q" placeholder="종목명·코드 검색">
  <span class="cnt" id="cnt"></span>
</div>

<div class="tw"><table id="tb"><thead></thead><tbody></tbody></table></div>

<div class="note" id="note"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let D=null, view='streak', minSk=3, minAmt=10, mk='all', minCap=0, sortK='surge', sortD=1, sel=null, chipF=null;
const fmt=n=>n==null?'–':Math.round(n).toLocaleString();
const f1=n=>n==null?'–':n.toFixed(1);
const f2=n=>n==null?'–':n.toFixed(2);
const uk=n=>n==null?'–':n>=10000?(n/10000).toFixed(1)+'조':fmt(n)+'억';
const eok=n=>n==null?'–':Math.abs(n)>=10000?(n/10000).toFixed(2)+'조':n>=100?fmt(n)+'억':f1(n)+'억';
const dt8=s=>s?s.slice(4,6)+'/'+s.slice(6,8):'–';
const pct=(g,d=1)=>g==null?'–':`<span class="${g>0?'g':g<0?'r':''}">${g>0?'+':''}${g.toFixed(d)}%</span>`;
const man=n=>n==null?'–':n>=1e4?(n/1e4).toFixed(1)+'만':fmt(n);
const bbShare=r=>r.bb&&r.bb.share!=null?r.bb.share:0;
const isBB=r=>bbShare(r)>=70;
const isNew=r=>{ if(!r.s_start||r.streak<1) return false; const i=r.ser.findIndex(s=>s[0]===r.s_start); return i>=0&&i<=1; };
const hasD=r=>(r.dart||[]).length>0;
const near5=r=>r.d5!=null&&r.d5<=10&&r.streak>=3;
const latestD=r=>{const a=(r.dart||[]).slice().sort((x,y)=>y.dt.localeCompare(x.dt));return a[0];};
// 종합 점수: 연속 누적액(로그) × 회전비중 × 규칙성 — 기계적 매집일수록 높음
const score=r=>{ if(r.streak<3) return 0; const a=Math.log10(1+r.s_amt), t=Math.min(r.turn||0,60)/60, reg=r.cv==null?0.5:Math.max(0,1-Math.min(r.cv,1.5)/1.5); return a*(0.4+t)*(0.5+reg)*Math.min(r.streak,20)/10; };

const SORTS=[['surge','급증 배수'],['s_amt','연속 누적'],['streak','연속일'],['turn','회전비중'],['est_pct','추정 지분'],['mcap','시총']];

function seg(id,items,cur,cb){ const el=$(id); el.innerHTML=''; items.forEach(([v,l])=>{ const b=document.createElement('button'); b.textContent=l; if(v===cur) b.classList.add('on'); b.onclick=()=>{cb(v);ui();render();}; el.appendChild(b); }); }
function ui(){
  seg('vm',[['streak','연속 매집'],['all','전체(급증·단일일 포함)']],view,v=>{view=v;if(v==='all'){minSk=0;}else if(minSk<3)minSk=3;});
  seg('sk',[[0,'없음'],[3,'3일'],[5,'5일'],[10,'10일'],[20,'20일']],minSk,v=>{minSk=v;});
  seg('am',[[0,'없음'],[10,'10억'],[30,'30억'],[100,'100억'],[300,'300억']],minAmt,v=>{minAmt=v;});
  seg('mf',[['all','전체'],['KOSPI','코스피'],['KOSDAQ','코스닥']],mk,v=>{mk=v;});
  seg('cf',[[0,'전체'],[1000,'1천억↑'],[3000,'3천억↑'],[10000,'1조↑'],[50000,'5조↑']],minCap,v=>{minCap=v;});
  seg('sf',SORTS,sortK,v=>{sortK=v;sortD=v==='cv'?-1:1;});
}
function rows(){
  const q=$('q').value.trim().toLowerCase();
  return D.rows.filter(r=>{
    if(view==='streak'&&r.streak<3) return false;
    if(r.streak<minSk) return false;
    const amt=r.streak>=3?r.s_amt:Math.max(r.cum20,r.max1);
    if(amt<minAmt) return false;
    if(mk!=='all'&&r.mkt!==mk) return false;
    if(minCap&&!(r.mcap>=minCap)) return false;
    if($('xbb').checked&&isBB(r)) return false;
    if($('onlyd').checked&&!hasD(r)) return false;
    if(chipF==='new'&&!isNew(r)) return false;
    if(chipF==='d5'&&!near5(r)) return false;
    if(chipF==='dart'&&!hasD(r)) return false;
    if(chipF==='bb'&&!isBB(r)) return false;
    if(q&&!(r.name.toLowerCase().includes(q)||r.code.includes(q))) return false;
    return true;
  });
}
function jump(code){
  const r=D.rows.find(x=>x.code===code); if(!r) return;
  // 요약에서 고른 종목이 필터에 가려지지 않도록 필요한 것만 푼다
  if(r.streak<3) view='all'; if(r.streak<minSk) minSk=0;
  const amt=r.streak>=3?r.s_amt:Math.max(r.cum20,r.max1); if(amt<minAmt) minAmt=0;
  if(mk!=='all'&&r.mkt!==mk) mk='all'; if(minCap&&r.mcap<minCap) minCap=0;
  if(isBB(r)) $('xbb').checked=false; if($('onlyd').checked&&!hasD(r)) $('onlyd').checked=false;
  chipF=null; $('q').value=''; sel=code; ui(); chips(); render();
  const tr=$('tb').querySelector(`tr.row[data-c="${code}"]`); if(tr) tr.scrollIntoView({behavior:'smooth',block:'center'});
}
function stc(r,extra){ return `<span class="st${isBB(r)?' bb':''}" data-j="${r.code}">${r.name}${extra?`<small>${extra}</small>`:''}</span>`; }
function today(){
  const all=D.rows.filter(r=>r.streak>=3&&r.s_amt>=3);
  const live=all.filter(r=>!isBB(r));
  const bd=D.base_dt, nBB=all.length-live.length;
  const ln=(lb,html)=>`<div class="ln"><span class="lb2">${lb}</span><span>${html||'<span class="dim">해당 없음</span>'}</span></div>`;
  // 1) 급증 배수 상위 10 — 매집 일평균 ÷ 직전 40일 |순매수| 평균
  const surge=live.slice().sort((a,b)=>b.surge-a.surge).slice(0,10)
    .map((r,i)=>stc(r,`${i+1}. ${f1(r.surge)}× · ${r.streak}일 ${eok(r.s_amt)}`)).join(' ');
  // 2) 5% 임박 상위 5 — 현 속도 유지 시 잔여 거래일 오름차순
  const d5=live.filter(r=>r.d5!=null).sort((a,b)=>a.d5-b.d5).slice(0,5)
    .map(r=>stc(r,`${r.est_pct.toFixed(2)}%`)).join(' ');
  // 3) 동일 날짜 시작 — 같은 날 매집을 시작한 묶음(2종목↑), 최근 날짜부터
  const byStart={}; live.forEach(r=>{(byStart[r.s_start]=byStart[r.s_start]||[]).push(r);});
  const same=Object.entries(byStart).filter(([,v])=>v.length>=2).sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([d,v])=>`<div class="ln"><span class="lb2"><b>${dt8(d)} 시작</b> →</span><span>${v.sort((a,b)=>b.s_amt-a.s_amt).map(r=>stc(r,eok(r.s_amt))).join(' ')}</span></div>`).join('');
  $('today').innerHTML=`<h3>오늘의 요약 <small>${bd.slice(4,6)}/${bd.slice(6,8)} 기준 · 연속 3일↑·누적 3억↑ ${live.length}종목${nBB?` (자사주로 설명 ${nBB} 제외)`:''}</small></h3>`
   +`<div class="sec"><h4>급증 배수 상위 10 <small>매집 일평균 ÷ 직전 40일 평균</small></h4>${surge?`<div class="ln"><span>${surge}</span></div>`:ln('','')}</div>`
   +`<div class="sec"><h4>5% 임박 상위 5 <small>종목(현재 취득 지분) · 잔여일 짧은 순</small></h4>${d5?`<div class="ln"><span>${d5}</span></div>`:ln('','')}</div>`
   +`<div class="sec"><h4>동일 날짜 시작 <small>같은 날 매집을 시작한 묶음</small></h4>${same||ln('','')}</div>`;
  $('today').querySelectorAll('[data-j]').forEach(e=>e.onclick=()=>jump(e.dataset.j));
}
function chips(){
  const all=D.rows.filter(r=>r.streak>=3&&r.s_amt>=10);
  const items=[
    [null,all.length,'연속 매집 포착','연속 3일↑ · 누적 10억↑'],
    ['new',all.filter(isNew).length,'신규 시작','최근 2거래일 내 시작'],
    ['d5',all.filter(r=>near5(r)&&!isBB(r)).length,'5% 임박','현 속도로 10거래일 이내 · 자사주 제외'],
    ['dart',all.filter(hasD).length,'지분공시 발생','매집 시작 후 5%·임원주요주주 보고'],
    ['bb',all.filter(isBB).length,'자사주로 설명','자사주 체결액 ≥ 기타법인 순매수 70%'],
  ];
  $('chips').innerHTML=items.map(([k,n,l,s])=>`<div class="chip${chipF===k?' on':''}" data-k="${k||''}"><b>${n}</b><span>${l}</span><small>${s}</small></div>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.k||null; chipF=(chipF===k)?null:k; if(k==='bb'){$('xbb').checked=false;} chips(); render();});
}
function head(){
  const H=[['rk','#',''],['surge','급증','직전40일 대비 배수'],['name','종목','',1],['mkt','시장','',1],['mcap','시총',''],['close','종가','등락'],
    ['streak','연속','시작일'],['s_amt','연속 누적','억'],['avg','일평균','억'],['avg_sh','일평균','순매수 주수'],['turn','회전비중','순매수/거래대금'],
    ['cv','규칙성','CV↓ 기계적'],['est_pct','취득 지분','상장주식 대비']];
  $('tb').tHead.innerHTML='<tr>'+H.map(([k,l,s,left])=>`<th class="${left?'l ':''}${sortK===k?'s':''}" data-k="${k}">${l}${s?`<small>${s}</small>`:''}</th>`).join('')+'</tr>';
  $('tb').tHead.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(k==='rk')return; if(sortK===k)sortD=-sortD; else{sortK=k;sortD=(k==='cv')?-1:1;} ui(); render();});
}
function render(){
  const rs=rows();
  const val=r=>{ const v=r[sortK]; if(sortK==='cv') return v==null?1e9:v; return v==null?-1e18:v; };
  rs.sort((a,b)=>{const x=val(a),y=val(b); if(typeof x==='string'||typeof y==='string') return sortD>0?String(x).localeCompare(String(y),'ko'):String(y).localeCompare(String(x),'ko'); return sortD>0?y-x:x-y;});
  // d5·cv 는 오름차순이 기본 정렬(sortD=-1)
  $('cnt').textContent=`${rs.length}종목`;
  const tb=$('tb').tBodies[0]; tb.innerHTML='';
  if(!rs.length){tb.innerHTML='<tr><td colspan="13" class="empty">조건에 맞는 종목이 없습니다</td></tr>';return;}
  rs.forEach((r,i)=>{
    const tr=document.createElement('tr'); tr.className='row'+(sel===r.code?' sel':''); tr.dataset.c=r.code;
    const ld=latestD(r);
    const tags=(isNew(r)?'<span class="tag new">신규</span>':'')+(r.bb?`<span class="tag bb">자사주 ${r.bb.share!=null?r.bb.share+'%':''}</span>`:'')+(near5(r)&&!isBB(r)?'<span class="tag d5">5% 임박</span>':'')+(ld?`<span class="tag dm">${ld.kind} ${dt8(ld.dt)}</span>`:'');
    tr.innerHTML=`<td><span class="rk${i<10?' top':''}">${i+1}</span></td>
      <td>${r.streak?`<b class="${r.surge>=10?'b':''}">${f1(r.surge)}×</b><br><small class="f">기준 ${eok(r.base)}</small>`:'–'}</td>
      <td class="l"><span class="nm">${r.name}</span><span class="cd">${r.code}</span>${tags}</td>
      <td class="l f">${r.mkt==='KOSPI'?'코스피':'코스닥'}</td>
      <td>${uk(r.mcap)}</td>
      <td>${fmt(r.close)}<br><small>${pct(r.ch)}</small></td>
      <td>${r.streak?`<b class="${r.streak>=10?'b':''}">${r.streak}일</b><br><small class="f">${dt8(r.s_start)}~</small>`:'<span class="f">–</span>'}</td>
      <td>${r.streak?`<b>${eok(r.s_amt)}</b>`:'–'}</td>
      <td>${r.streak?eok(r.avg):'–'}</td>
      <td>${r.streak?man(r.avg_sh)+'주':'–'}</td>
      <td>${r.turn!=null?`${f1(r.turn)}%`:'–'}</td>
      <td>${r.cv!=null?`<span class="${r.cv>=1?'f':''}">${f2(r.cv)}</span>`:'–'}</td>
      <td>${r.streak?`<b class="${r.est_pct>=1?'b':''}">${r.est_pct.toFixed(2)}%</b>`:'–'}</td>
`;
    tr.onclick=()=>{sel=sel===r.code?null:r.code;render();};
    tb.appendChild(tr);
    if(sel===r.code){const d=document.createElement('tr');d.className='det';d.innerHTML=`<td colspan="13">${detail(r)}</td>`;tb.appendChild(d);}
  });
}
function chart(r){
  const ser=r.ser.slice().reverse(); // 오래된→최신
  const W=620,H=200,L=44,R=44,T=10,B=22,n=ser.length;
  const iw=W-L-R, bw=iw/n;
  const vals=ser.map(s=>s[2]/100), mx=Math.max(1,...vals.map(Math.abs));
  const px=ser.map(s=>s[1]), pmin=Math.min(...px), pmax=Math.max(...px), pr=(pmax-pmin)||1;
  const y0=T+(H-T-B)*(mx/(2*mx)); const sy=v=>y0-(v/mx)*(H-T-B)/2;
  const startIdx=ser.findIndex(s=>s[0]===r.s_start);
  let bars='';
  ser.forEach((s,i)=>{const v=s[2]/100; const x=L+i*bw+1, h=Math.abs(sy(v)-y0); const inS=startIdx>=0&&i>=startIdx; bars+=`<rect class="${v>=0?(inS?'bpos':'bout'):'bneg'}" x="${x.toFixed(1)}" y="${(v>=0?sy(v):y0).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h.toFixed(1)}"><title>${s[0]} 기타법인 ${f1(v)}억 · 종가 ${fmt(s[1])}</title></rect>`;});
  const path=ser.map((s,i)=>`${i?'L':'M'}${(L+i*bw+bw/2).toFixed(1)},${(T+(H-T-B)*(1-(s[1]-pmin)/pr)).toFixed(1)}`).join('');
  const xl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${dt8(ser[i][0])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><line class="ax" x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}"/>${bars}<path class="px" d="${path}"/>
    <text x="${L-4}" y="${T+8}" text-anchor="end">+${f1(mx)}억</text><text x="${L-4}" y="${H-B}" text-anchor="end">-${f1(mx)}억</text>
    <text x="${W-R+4}" y="${T+8}">${fmt(pmax)}</text><text x="${W-R+4}" y="${H-B}">${fmt(pmin)}</text>${xl}</svg>`;
}
function detail(r){
  let cum=0;
  const dtRows=r.ser.slice(0,20).map(s=>{const sh=(s[4]!=null)?s[4]:(s[1]>0?s[2]*1e6/s[1]:0); return [s,sh];});
  const qLabel=r.qty?'순매수 수량':'추정 주수';
  // 누적은 오래된→최신으로 계산
  const cums=[]; dtRows.slice().reverse().forEach(([s,sh])=>{cum+=sh;cums.push(cum);}); cums.reverse();
  const tbl=`<table class="dtt"><thead><tr><th>날짜</th><th>종가</th><th>기타법인</th><th>거래대금</th><th>비중</th><th>${qLabel}</th><th>20일 누적 지분</th></tr></thead><tbody>`+
    dtRows.map(([s,sh],i)=>`<tr><td>${dt8(s[0])}</td><td>${fmt(s[1])}</td><td class="${s[2]>0?'b':s[2]<0?'r':'f'}">${f1(s[2]/100)}억</td><td class="f">${eok(s[3]/100)}</td><td>${s[3]>0?f1(s[2]/s[3]*100)+'%':'–'}</td><td class="${s[4]!=null?'':'f'}">${man(Math.round(sh))}</td><td class="f">${(cums[i]/r.list*100).toFixed(2)}%</td></tr>`).join('')+'</tbody></table>';
  const dart=(r.dart||[]).slice().sort((a,b)=>b.dt.localeCompare(a.dt));
  const dl=dart.length?'<ul>'+dart.map(x=>`<li><span class="tag dm">${x.kind}</span> ${dt8(x.dt)} <b>${x.who}</b> · <a target="_blank" rel="noopener" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${x.no}">${x.nm}</a></li>`).join('')+'</ul>'
    :`<div class="f" style="font-size:12px;margin-bottom:10px">${r.streak>=3&&r.s_amt>=5?'매집 시작 7일 전부터 접수된 지분공시 없음':'지분공시 조회 대상 아님(연속 3일·5억 미만)'}</div>`;
  const bb=r.bb?`<div class="kv"><span>자사주 매수</span><b>${r.bb.type||''} · ${r.bb.status==='active'?'진행중':'종료'} ${r.bb.start?dt8(r.bb.start)+'~'+dt8(r.bb.end||''):''}</b><span>구간 체결액</span><b>${eok(r.bb.amt)} <small class="f">(기타법인 순매수의 ${r.bb.share!=null?r.bb.share+'%':'–'})</small></b><span>진행률</span><b>${r.bb.pct!=null?r.bb.pct+'%':'–'}</b></div>`:'';
  const kv=`<div class="kv"><span>연속 매집</span><b>${r.streak}거래일 (${dt8(r.s_start)}~) · 누적 ${eok(r.s_amt)} · 일평균 ${eok(r.avg)} ${r.qty?'=':'≈'} ${man(r.avg_sh)}주</b>
    <span>${r.qty?'취득 지분':'추정 취득 지분'}</span><b>${r.est_pct.toFixed(3)}% <small class="f">(속도 ${(r.pace).toFixed(3)}%/일 → 5%까지 ${r.d5==null?'–':r.d5<=0?'도달':'약 '+r.d5+'거래일'})</small></b>
    <span>거래대금 비중</span><b>${f1(r.turn)}% · 규칙성 CV ${f2(r.cv)} · 직전 40일 대비 ${f1(r.surge)}×</b></div>`;
  return `<div class="det"><div class="grid"><div><h4>기타법인 일별 순매수(억, 파랑=매집 구간) · 회색=종가 — 최근 ${r.ser.length}거래일</h4>${chart(r)}${kv}${bb}<h4>지분공시 (OpenDART · 매집 시작 7일 전~)</h4>${dl}
    <div style="font-size:12px"><a target="_blank" rel="noopener" href="https://finance.naver.com/item/frgn.naver?code=${r.code}">네이버 투자자별 매매동향</a> · <a target="_blank" rel="noopener" href="https://dart.fss.or.kr/dsab007/main.do?option=corp&textCrpNm=${encodeURIComponent(r.name)}">DART 공시검색</a></div></div>
    <div><h4>최근 20거래일</h4>${tbl}</div></div></div>`;
}
function note(){
  const g=D.gate;
  $('note').innerHTML=`<h3>읽는 법</h3><ul>
  <li><b>기타법인</b>은 KRX 투자자 분류(금융투자·보험·투신·사모·은행·기타금융·연기금·국가·기타법인·개인·외국인)에서 금융회사가 아닌 일반 법인의 매매. 지주회사·계열사·대주주 법인의 지분 매집, 상장사의 <b>자사주 직접 매수</b>, 벤처캐피탈·일반 법인의 블록 매매가 여기 잡힌다.</li>
  <li><b>연속 매집</b>: 유의 하한(최근 5일 양수 평균의 15%, 최소 0.1억) 이상의 순매수가 끊기지 않은 거래일 수. 매일 비슷한 금액이 들어오면(규칙성 CV 낮음) 분할 매수 프로그램일 가능성 — 5% 보고 전 단계에서 흔한 형태.</li>
  <li><b>취득 지분</b> = Σ(일별 기타법인 순매수 수량) ÷ 상장주식수. 수량은 키움 ka10059 수량 모드로 포착 종목만 재조회한 실제 순매수 주수(확정치)이며, 수량을 못 받은 종목만 순매수액÷종가로 추정(회색 표기·≈). 기타법인 전체의 순매수라 단일 매수자로 확정할 수 없고, 매수자가 이미 보유한 지분은 모름. <b>5%까지 잔여일</b>은 매집 시작을 0%로 놓고 현재 속도가 유지될 때의 산술 추정이며, 기존 5% 이상 보유자는 1%p 변동마다 보고 의무가 있어 그전에 공시가 나올 수 있다.</li>
  <li><b>자사주</b> 태그: 자사주 매수 트래커(KIND 신청·체결)의 같은 구간 체결액 ÷ 기타법인 순매수. 70% 이상이면 자사주로 설명된다고 보고 기본 제외.</li>
  <li><b>지분공시</b>: 포착 종목(연속 3일·5억↑)에 한해 OpenDART 지분공시(주식등의대량보유상황보고서=5%, 임원ㆍ주요주주특정증권등소유상황보고서)를 매집 시작 7일 전부터 조회. 보고자(flr_nm)가 매수 주체의 힌트.</li>
  <li>수록 게이트: 시총 ${fmt(g.mcap_min_eok)}억↑ 보통주 중 (연속 ${g.streak}일↑ &amp; 연속 누적 ${g.streak_amt_eok}억↑) 또는 20일 누적 ${g.cum20_eok}억↑ 또는 단일일 ${g.max1_eok}억↑. 급증 배수 = 매집 일평균 ÷ 직전 ${g.base_days}일 |순매수| 평균(하한 0.5억).</li>
  <li>데이터: 키움 ka10059 종목별 투자자 순매수 금액(KRX 기준·NXT 제외·백만원), 평일 16:05 잠정·21:00 확정 수집분. 수량은 같은 API의 수량 모드(주)로 포착 종목만 재조회. 사용자 출처의 "일평균 매수량"은 총매수 주수라 여기 순매수 주수보다 다소 크게 나온다.</li></ul>`;
}
async function load(){
  const r=await fetch('data/etccorp.json?v='+Math.floor(Date.now()/6e5)); D=await r.json();
  $('hd').innerHTML=`기준일 <b>${D.base_dt.slice(0,4)}-${D.base_dt.slice(4,6)}-${D.base_dt.slice(6,8)}</b> ${D.provisional?'<span class="prov">(장중·잠정치)</span>':'(확정치)'} · 스캔 ${fmt(D.n_universe)}종목 → 수록 ${D.n_rows} · 빌드 ${D.built_at}`;

  ['q'].forEach(id=>$(id).oninput=render); ['xbb','onlyd'].forEach(id=>$(id).onchange=render);
