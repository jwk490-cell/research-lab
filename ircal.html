<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IR·컨콜 캘린더</title>
<meta name="description" content="국내외 실적발표, 증권사 그룹컨콜, 기관 IR을 한국시간으로 한눈에.">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script>
/* 리서치랩 테마 연동: 상위 사이트와 같은 rl-theme(기본 다크)를 따르고, 상위에서 토글하면 storage 이벤트로 즉시 반영 */
(function(){var qt=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];function ap(){var t='dark';try{t=localStorage.getItem('rl-theme')||'dark';}catch(e){}if(qt)t=qt;document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
ap();window.addEventListener('storage',function(e){if(e.key==='rl-theme')ap();});})();
</script>
<style>
/* Research Lab 허브 셸과 같은 토큰 */
:root{
  --bg:#f2f4f6;--surface:#fff;--surface2:#f7f8fa;--line:#e7eaee;--line2:#eef0f3;
  --text:#191f28;--sub:#4e5968;--faint:#8b95a1;
  --accent:#3168f0;--accent-soft:rgba(49,104,240,.08);--accent-line:rgba(49,104,240,.28);
  --shadow:0 1px 3px rgba(25,31,40,.04);--shadow-pop:0 12px 40px rgba(25,31,40,.18);
  --k-call:#16a37a;--k-ir:#e07a2f;--k-earn:#3168f0;--k-event:#8f63e0;
  --tint:.09;color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#101014;--surface:#1a1b20;--surface2:#202128;--line:#272930;--line2:#232530;
  --text:#e9ebee;--sub:#9aa2ad;--faint:#6d7480;
  --accent:#4d7df5;--accent-soft:rgba(77,125,245,.14);--accent-line:rgba(77,125,245,.4);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-pop:0 16px 48px rgba(0,0,0,.55);
  --k-call:#2ec08f;--k-ir:#f0954f;--k-earn:#5a8cff;--k-event:#a888f0;
  --tint:.14;color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
*,*::before,*::after{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕",-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;padding:20px 22px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1360px;margin:0 auto}
svg.lucide{flex:none;vertical-align:-2px}
.num{font-variant-numeric:tabular-nums}

/* 헤더 */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.head .desc{font-size:12.5px;color:var(--faint);margin-top:3px}
.head .sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);border:1px solid var(--line);
  background:var(--surface);border-radius:999px;padding:6px 12px}
.sync:hover{border-color:var(--accent-line);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--k-call);box-shadow:0 0 0 3px color-mix(in srgb,var(--k-call) 22%,transparent)}

/* 요약 카드 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2.2fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 15px;min-width:0;box-shadow:var(--shadow)}
.stat small{display:block;font-size:11.5px;color:var(--faint);font-weight:600}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat b em{font-style:normal;font-size:12px;color:var(--faint);font-weight:500;margin-left:3px}
.next{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.next::-webkit-scrollbar{display:none}
.nx{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface2);border-radius:9px;padding:5px 9px;text-align:left}
.nx:hover{border-color:var(--accent-line)}
.nx .d{font-size:11px;color:var(--faint);line-height:1.15;text-align:center}
.nx .d b{display:block;font-size:14px;color:var(--text);font-weight:800}
.nx strong{display:block;font-size:12px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx span small{font-size:10.5px;color:var(--faint)}
.muted{color:var(--faint);font-size:12px}

/* 툴바 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
.period{display:flex;align-items:center;gap:6px}
.period h2{font-size:18px;font-weight:800;letter-spacing:-.02em;min-width:108px}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--sub)}
.ib:hover{color:var(--text);border-color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--sub)}
.btn:hover{color:var(--text);border-color:var(--faint)}
.range{font-size:12px;color:var(--faint);margin-left:4px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 9px;height:32px;color:var(--faint)}
.search:focus-within{border-color:var(--accent-line)}
.search input{border:0;background:none;outline:0;width:150px;font-size:12.5px;color:var(--text)}
.search input::placeholder{color:var(--faint)}
select{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:32px;padding:0 8px;font-size:12px;color:var(--sub);max-width:160px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--faint)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.chip span{font-size:11px;font-weight:500;color:var(--faint)}
.chip.on{color:var(--text);border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--surface))}
.chip.on i{opacity:1}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.tg input{accent-color:var(--accent)}
.c-call{--c:var(--k-call)}.c-ir{--c:var(--k-ir)}.c-earnings{--c:var(--k-earn)}.c-conference{--c:var(--k-event)}
.spinning{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* 캘린더 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.wk,.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.wk div{padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--faint);border-bottom:1px solid var(--line);background:var(--surface2)}
.grid{gap:1px;background:var(--line2)}
.cell{min-height:118px;background:var(--surface);padding:7px 6px 8px;min-width:0}
.cell.other{background:var(--surface2)}
.cell.other .dn{color:var(--faint);opacity:.6}
.cell.today{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.ct{display:flex;align-items:center;gap:6px;margin:0 3px 6px}
.dn{font-size:13px;font-weight:700}
.cell.today .dn{background:var(--accent);color:#fff;border-radius:7px;padding:1px 7px}
.ct .cnt{margin-left:auto;font-size:10.5px;color:var(--faint)}
.evs{display:flex;flex-direction:column;gap:4px}
.ev{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border-radius:7px;padding:6px 7px 6px 8px;
  border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--surface))}
.ev:hover{background:color-mix(in srgb,var(--c) calc(var(--tint)*190%),var(--surface))}
.ev .m{display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.ev strong{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .t{font-size:10.5px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .s{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--faint);min-width:0}
.ev .s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .s .h{color:var(--sub);font-weight:600}
.ev .s .md{flex:none;display:inline-flex;align-items:center;gap:3px}
.cal.month .cell{min-height:104px}
.scroll{overflow-x:auto}
.scroll .wk,.scroll .grid{min-width:680px}

/* 목록 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.lr{display:grid;grid-template-columns:62px 60px minmax(0,1.3fr) 88px minmax(0,1.4fr) minmax(0,1fr) 16px;gap:12px;align-items:center;
  width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line2)}
.lr:last-child{border-bottom:0}
.lr:hover{background:var(--surface2)}
.lr .d{font-weight:700;font-variant-numeric:tabular-nums}.lr .d small{color:var(--faint);font-weight:500;margin-left:3px}
.lr .t{color:var(--sub);font-variant-numeric:tabular-nums;font-size:12px}
.lr strong{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .h,.lr .src{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .h b{color:var(--sub);font-weight:600}
.lr>svg{color:var(--faint)}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;
  color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*140%),transparent);white-space:nowrap}
.empty,.loading{padding:48px 0;text-align:center;color:var(--faint)}
.error{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,#ef4444 40%,var(--line));color:#ef4444;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.error button{margin-left:auto;text-decoration:underline}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--faint)}
.foot span{display:inline-flex;align-items:center;gap:5px}
.foot button{color:var(--sub);display:inline-flex;align-items:center;gap:4px}
.foot button:hover{color:var(--accent)}

/* 모달 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.48);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{position:relative;width:min(560px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow-pop)}
.modal .x{position:absolute;right:14px;top:14px;color:var(--faint);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.modal .x:hover{background:var(--surface2);color:var(--text)}
.modal h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.modal .when{color:var(--sub);font-size:13.5px;padding-bottom:16px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.modal .when b{color:var(--text);margin-left:6px}.modal .when small{color:var(--faint);margin-left:4px}
.modal dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px 14px;padding-top:12px;font-size:13px}
.modal dt{color:var(--faint)}
.modal dd{color:var(--text);min-width:0;overflow-wrap:anywhere}
.modal .notes{white-space:pre-wrap;line-height:1.65;color:var(--sub);font-size:12.5px}
.tag{display:inline-block;margin-left:6px;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--faint)}
.tag.ok{color:var(--k-call);border-color:color-mix(in srgb,var(--k-call) 40%,var(--line))}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.primary{background:var(--accent);color:#fff;border-radius:9px;padding:8px 18px;font-weight:700;font-size:13px;margin-left:auto}
.eyebrow{font-size:10.5px;letter-spacing:.12em;color:var(--faint);font-weight:700}
.info{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--sub);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.6;margin:12px 0}
.run{border-top:1px solid var(--line2);padding:14px 0}
.run>div{display:flex;justify-content:space-between;margin-bottom:6px}
.run time{color:var(--faint);font-size:11.5px}
.run p{font-size:12.5px;line-height:1.65;color:var(--sub)}
.run small{display:inline-block;margin-top:6px;color:var(--faint);font-size:11.5px;margin-right:10px}
.run a{font-size:11.5px;margin-right:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);border-radius:10px;padding:11px 20px;font-size:12.5px;box-shadow:var(--shadow-pop)}

@media(max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats .upn{grid-column:1/-1}.lr{grid-template-columns:56px 54px minmax(0,1.3fr) 84px minmax(0,1.3fr) 16px}.lr .src{display:none}}
@media(max-width:700px){
  body{padding:14px 16px 32px}
  .head h1{font-size:18px}
  .stat{padding:10px 12px}.stat b{font-size:19px}
  .search input{width:100%}.search{flex:1;min-width:0}
  .bar{position:static}
  .lr{grid-template-columns:48px 44px minmax(0,1fr) auto;gap:8px;padding:11px 12px}
  .lr .h,.lr>svg{display:none}
  .modal{padding:22px 18px}.modal dl{grid-template-columns:86px minmax(0,1fr)}
  .tg.wkd{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>IR·컨콜 캘린더</h1><div class="desc">국내외 실적발표·증권사 그룹컨콜·기관 IR — 모든 시간은 한국시간(KST) · 원본: <a href="https://daeyoung-ir-calendar.coral-emu-4631.chatgpt.site/" target="_blank" rel="noreferrer">DY 마켓 캘린더</a></div></div>
    <span class="sp"></span>
    <button class="sync" id="syncBtn"><span class="dot" id="statusDot"></span><span id="syncTxt">동기화 대기</span></button>
  </div>

  <div class="stats">
    <div class="stat"><small>선택 기간</small><b class="num"><span id="stRange">0</span><em>건</em></b></div>
    <div class="stat"><small>오늘</small><b class="num"><span id="stToday">0</span><em>건</em></b></div>
    <div class="stat"><small>전체 일정</small><b class="num"><span id="stAll">0</span><em>건</em></b></div>
    <div class="stat upn"><small>다가오는 일정</small><div class="next" id="nextList"></div></div>
  </div>

  <div class="bar">
    <div class="row">
      <div class="period"><h2 id="periodH"></h2>
        <button class="ib" aria-label="이전 기간" id="prevBtn"><i data-ic="chevL" data-s="16"></i></button>
        <button class="ib" aria-label="다음 기간" id="nextBtn"><i data-ic="chevR" data-s="16"></i></button>
        <button class="btn" id="todayBtn">오늘</button><span class="range" id="rangeLabel"></span></div>
      <span class="sp"></span>
      <div class="search"><i data-ic="search" data-s="14"></i><input placeholder="종목 · 기관 · 메모 검색" aria-label="검색" id="q"><button aria-label="검색 지우기" id="qClear" style="display:none"><i data-ic="x" data-s="13"></i></button></div>
      <div class="seg" id="viewToggle"><button data-v="fortnight">2주</button><button data-v="month">월간</button><button data-v="list">목록</button></div>
    </div>
    <div class="row">
      <div class="row" id="kindFilters"></div>
      <span class="sp"></span>
      <select aria-label="일정 출처" id="srcSel"><option value="all">전체 출처</option><option value="verified">공식 확인 일정</option><option value="upload">제공 자료 · 직접 입력</option></select>
      <select aria-label="주최 증권사" id="hostSel"><option value="all">전체 증권사</option></select>
      <label class="tg"><input type="checkbox" id="ovChk"><i data-ic="globe" data-s="13"></i>해외 <span id="ovCnt" class="muted"></span></label>
      <label class="tg wkd"><input type="checkbox" id="wkChk">주말</label>
      <button class="btn" id="icsBtn"><i data-ic="dl" data-s="13"></i>.ics</button>
      <button class="ib" aria-label="새로고침" id="reloadBtn"><i data-ic="refresh" data-s="14"></i></button>
    </div>
  </div>

  <div id="errBox"></div>
  <div id="view"><div class="loading">일정을 불러오고 있습니다…</div></div>
  <div class="foot"><span><i data-ic="info" data-s="13"></i>시간 미정 = 원문에 시간이 없는 일정 · ✓ = 공시 원문 확인 · 원본 <a href="https://daeyoung-ir-calendar.coral-emu-4631.chatgpt.site/" target="_blank" rel="noreferrer">DY 마켓 캘린더</a>에서 30분마다 동기화</span><button id="logBtn">출처 및 확인 이력 <i data-ic="arrowUR" data-s="13"></i></button></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',chevL:'<path d="m15 18-6-6 6-6"/>',chevR:'<path d="m9 18 6-6-6-6"/>',
  dl:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  search:'<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',arrowUR:'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>'
};
const ic=(n,s)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true">${IC[n]}</svg>`;
document.querySelectorAll('i[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic,el.dataset.s);});

const W={call:'컨퍼런스콜',ir:'기관 IR',earnings:'실적발표',event:'주요 행사'};
const KINDS=['call','ir','earnings','event'];
const DOW=['일','월','화','수','목','금','토'],HEAD=['월','화','수','목','금','토','일'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=e=>e.kind==='event'?'conference':e.earningsCall?'earnings':e.kind;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const kstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date);
const D=s=>new Date(`${s}T12:00:00`);
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d);};
const monday=s=>add(s,-((D(s).getDay()+6)%7));
const fmtAt=s=>new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};

const S={today:kstToday(),cursor:kstToday(),view:LS('ircal-view')||'fortnight',data:{events:[],runs:[],schedule:{enabled:false,label:''}},
  loading:true,err:'',q:'',kinds:[...KINDS],weekend:false,src:'all',overseas:LS('ircal-ov')==='1',host:'all',sel:null,log:false};

async function load(){
  S.loading=true;S.err='';$('reloadBtn').querySelector('svg').classList.add('spinning');
  try{const r=await fetch('data/ircal.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('조회 실패 ('+r.status+')');S.data=await r.json();}
  catch(e){S.err=e instanceof Error?e.message:'조회 실패';}
  finally{S.loading=false;$('reloadBtn').querySelector('svg').classList.remove('spinning');render();}
}

function derive(){
  const all=S.data.events.filter(e=>e.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.company.localeCompare(b.company,'ko'));
  const J=all.filter(e=>S.overseas||e.market!=='overseas');
  const hosts=[...new Set(all.filter(e=>e.groupEvent&&e.host).map(e=>e.host))].sort((a,b)=>a.localeCompare(b,'ko'));
  const q=S.q.toLowerCase();
  const Y=J.filter(e=>S.kinds.includes(e.kind)&&(S.host==='all'||e.host===S.host)&&(S.src==='all'||(S.src==='verified'?e.verified:!e.verified))&&`${e.company} ${e.host} ${e.notes}`.toLowerCase().includes(q));
  const n=S.cursor,X=D(n),m1=`${n.slice(0,7)}-01`,Z=monday(S.view==='fortnight'?n:m1);
  const last=new Date(X.getFullYear(),X.getMonth()+1,0);
  const len=S.view==='fortnight'?14:Math.ceil((((D(m1).getDay()+6)%7)+last.getDate())/7)*7;
  const days=Array.from({length:len},(_,i)=>add(Z,i)).filter(d=>S.weekend||![0,6].includes(D(d).getDay()));
  const Q=Y.filter(e=>S.view==='fortnight'?e.date>=Z&&e.date<=add(Z,13):e.date.slice(0,7)===n.slice(0,7));
  return {J,ovN:all.filter(e=>e.market==='overseas').length,hosts,Y,X,Z,days,Q,
    next:J.filter(e=>e.date>=S.today).slice(0,8),todayN:J.filter(e=>e.date===S.today).length};
}

function evBtn(e){
  const fmt=e.format||(e.kind==='call'?'컨콜':e.kind==='ir'?'IR':e.kind==='event'?'행사':'실적');
  return `<button class="ev c-${cls(e)}" data-id="${esc(e.id)}" title="${esc(`${e.company} ${e.time||'시간 미정'} · ${e.host||W[e.kind]}`)}">`+
    `<span class="m"><strong>${esc(e.company)}</strong><span class="t">${esc(e.time||'미정')}</span></span>`+
    `<span class="s"><span class="${e.host?'h':''}">${esc(e.host||e.sector||W[e.kind])}</span>`+
    `<span class="md">${e.market==='overseas'?ic('globe',10):''}${esc(fmt)}${e.webinar&&e.format!=='Zoom'?' · 웹':''}${e.registration?' · 신청':''}${e.verified?ic('check',10):''}</span></span></button>`;
}

function render(){
  const v=derive();S._v=v;
  $('kindFilters').innerHTML=KINDS.map(k=>`<button class="chip c-${k==='event'?'conference':k} ${S.kinds.includes(k)?'on':''}" data-k="${k}"><i></i>${W[k]}<span>${v.J.filter(e=>e.kind===k).length}</span></button>`).join('');
  const hs=$('hostSel'),hv=v.hosts.join('|');
  if(hs.dataset.h!==hv){hs.innerHTML='<option value="all">전체 증권사</option>'+v.hosts.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('');hs.dataset.h=hv;}
  hs.value=S.host;$('srcSel').value=S.src;
  $('nextList').innerHTML=v.next.length?v.next.map(e=>`<button class="nx" data-id="${esc(e.id)}"><span class="d"><b>${Number(e.date.slice(8))}</b>${Number(e.date.slice(5,7))}월</span><span><strong>${esc(e.company)}</strong><small>${esc(e.time||'시간 미정')} · ${W[e.kind]}</small></span></button>`).join(''):'<span class="muted">예정 일정이 없습니다.</span>';
  $('stRange').textContent=v.Q.length;$('stToday').textContent=v.todayN;$('stAll').textContent=v.J.length;
  const sch=S.data.schedule||{},run=(S.data.runs||[])[0];
  $('statusDot').className='dot'+(sch.enabled?' on':'');
  $('syncTxt').textContent=(run?`원본 확인 ${fmtAt(run.at)}`:'확인 이력 없음')+(S.data.syncedAt?` · 반영 ${fmtAt(S.data.syncedAt)}`:'');
  $('periodH').textContent=`${v.X.getFullYear()}년 ${v.X.getMonth()+1}월`;
  const e13=add(v.Z,13);
  $('rangeLabel').textContent=S.view==='fortnight'?`${Number(v.Z.slice(5,7))}.${Number(v.Z.slice(8))} – ${Number(e13.slice(5,7))}.${Number(e13.slice(8))}`:'';
  $('viewToggle').querySelectorAll('button').forEach(b=>b.className=b.dataset.v===S.view?'on':'');
  $('ovChk').checked=S.overseas;$('wkChk').checked=S.weekend;$('ovCnt').textContent=v.ovN;
  $('qClear').style.display=S.q?'':'none';
  $('errBox').innerHTML=S.err?`<div class="error">${ic('info',15)}${esc(S.err)}<button id="retryBtn">다시 시도</button></div>`:'';
  let h;
  if(S.loading&&!S.data.events.length)h='<div class="loading">일정을 불러오고 있습니다…</div>';
  else if(S.view==='list'){
    h='<div class="list">'+(v.Q.length?v.Q.map(e=>`<button class="lr" data-id="${esc(e.id)}"><span class="d">${Number(e.date.slice(5,7))}.${e.date.slice(8)}<small>${DOW[D(e.date).getDay()]}</small></span><span class="t">${esc(e.time||'미정')}</span><strong>${esc(e.company)}</strong><span class="c-${cls(e)}"><span class="pill">${W[e.kind]}</span></span><span class="h"><b>${esc(e.host||e.sector||'—')}</b>${e.format?' · '+esc(e.format):''}</span><span class="src">${e.market==='overseas'?ic('globe',11)+' ':''}${e.verified?ic('check',11)+' ':''}${esc(e.source)}</span>${ic('chevR',15)}</button>`).join(''):'<div class="empty">조건에 맞는 일정이 없습니다.</div>')+'</div>';
  }else{
    const cols=S.weekend?7:5;
    h=`<div class="cal ${S.view} scroll" style="--cols:${cols}"><div class="wk">${HEAD.slice(0,cols).map(d=>`<div>${d}</div>`).join('')}</div><div class="grid">`+
      v.days.map(d=>{const r=v.Y.filter(e=>e.date===d),t=d===S.today;
        return `<div class="cell ${t?'today':''} ${S.view==='month'&&d.slice(0,7)!==S.cursor.slice(0,7)?'other':''}"><div class="ct"><span class="dn">${Number(d.slice(8))}</span><span class="cnt">${r.length?r.length+'건':''}</span></div><div class="evs">${r.map(evBtn).join('')}</div></div>`;}).join('')+'</div></div>';
  }
  $('view').innerHTML=h;
  renderModal();
}

function renderModal(){
  const z=S.sel;let h='';
  if(z){
    const how=(z.format||((z.webinar?'웹 중계 · ':'')+(z.kind==='call'||(z.notes||'').includes('컨퍼런스콜')?'컨퍼런스콜':W[z.kind])))+(z.registration?' · 사전 신청':'');
    h=`<div class="ov"><section class="modal" role="dialog" aria-modal="true" aria-label="일정 상세"><button class="x" aria-label="닫기" data-close="1">${ic('x',18)}</button>`+
      `<span class="c-${cls(z)}"><span class="pill">${W[z.kind]}</span></span><h2>${esc(z.company)}</h2><p class="when">${z.date.replaceAll('-','.')} (${DOW[D(z.date).getDay()]})<b>${esc(z.time||'시간 미정')}</b><small>KST</small></p>`+
      `<dl><dt>구분 · 분야</dt><dd>${z.market==='overseas'?'해외':'국내'}${z.sector?' · '+esc(z.sector):''}${z.groupEvent?' · 그룹 미팅':''}</dd>`+
      `<dt>주최</dt><dd>${esc(z.host||'미기재')}</dd><dt>진행 방식</dt><dd>${esc(how)}</dd>`+
      `<dt>출처</dt><dd>${esc(z.source)}<span class="tag ${z.verified?'ok':''}">${z.verified?'공식 확인':'원문 확인 전'}</span></dd>`+
      `<dt>메모</dt><dd class="notes">${esc(z.notes||'등록된 메모가 없습니다.')}</dd></dl>`+
      `<div class="acts">${z.sourceUrl?`<a href="${esc(z.sourceUrl)}" target="_blank" rel="noreferrer">원문 확인 ${ic('arrowUR',13)}</a>`:''}<button class="primary" data-close="1">확인</button></div></section></div>`;
  }else if(S.log){
    const sch=S.data.schedule||{},runs=S.data.runs||[],ok=runs.find(r=>r.status==='success');
    h=`<div class="ov"><section class="modal" role="dialog" aria-modal="true" aria-label="확인 이력"><button class="x" aria-label="닫기" data-close="1">${ic('x',18)}</button>`+
      `<div class="eyebrow">SOURCE &amp; UPDATES</div><h2>일정 확인 이력</h2><p class="muted">${esc(sch.label||'')}${sch.label?' · ':''}공시 확인 후 반영 · Research Lab 30분 동기화</p>`+
      `<div class="info">DART·KIND 공시와 기업 공식 IR을 확인합니다. 제공 자료는 별도로 표시하며, 확인이 제한된 경우 기존 일정을 유지합니다.<br>원본 출처: <a href="https://daeyoung-ir-calendar.coral-emu-4631.chatgpt.site/" target="_blank" rel="noreferrer">DY 마켓 캘린더</a> — 일정·확인 이력은 원본 데이터를 그대로 옮긴 것입니다.</div>`+
      `<p class="muted">마지막 전체 확인: ${ok?fmtAt(ok.at):'아직 없음'}${S.data.syncedAt?' · 마지막 변경 반영: '+fmtAt(S.data.syncedAt):''}</p>`+
      (runs.length?runs.map(r=>`<article class="run"><div><strong>${r.status==='success'?'확인 완료':r.status==='partial'?'일부 확인':'확인 실패'}</strong><time>${fmtAt(r.at)}</time></div><p>${esc(r.summary)}</p><small>추가 ${r.added??0} · 변경 ${r.updated??0}</small>${(r.sources||[]).map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noreferrer">출처 ${i+1} ↗</a>`).join('')}</article>`).join(''):'<div class="empty">확인 이력이 없습니다.</div>')+
      `</section></div>`;
  }
  $('modalRoot').innerHTML=h;
}

function toast(m){$('toastRoot').innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toastRoot').innerHTML='',3500);}

function exportIcs(){
  const Q=S._v.Q,e=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Research Lab//IR Calendar//KO','CALSCALE:GREGORIAN',...Q.flatMap(t=>{const n=t.date.replaceAll('-',''),r=t.time?`${n}T${t.time.replace(':','')}00`:n;
    return ['BEGIN:VEVENT',`UID:${t.id}@rl-ircal`,`DTSTAMP:${stamp}`,`${t.time?'DTSTART;TZID=Asia/Seoul':'DTSTART;VALUE=DATE'}:${r}`,`SUMMARY:${e(`${t.company} · ${W[t.kind]}`)}`,
      `DESCRIPTION:${e([t.time?'':'시간 미정',t.host,t.notes,`출처: ${t.source}`,t.sourceUrl].filter(Boolean).join('\n'))}`,...(t.sourceUrl?[`URL:${t.sourceUrl}`]:[]),'END:VEVENT'];}),'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([t],{type:'text/calendar;charset=utf-8'}));
  a.href=u;a.download=`IR-calendar-${S.cursor.slice(0,7)}.ics`;a.click();URL.revokeObjectURL(u);toast(`${Q.length}개 일정을 내보냈습니다.`);
}

function move(k){if(S.view==='fortnight')S.cursor=add(S.cursor,14*k);else{const d=D(S.cursor);d.setDate(1);d.setMonth(d.getMonth()+k);S.cursor=ymd(d);}render();}
const close=()=>{S.sel=null;S.log=false;renderModal();};

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('#modalRoot')){if(t.classList.contains('ov')||t.closest('[data-close]'))close();return;}
  const idb=t.closest('[data-id]');if(idb){S.sel=S.data.events.find(e=>e.id===idb.dataset.id)||null;renderModal();return;}
  const k=t.closest('.chip');if(k){const x=k.dataset.k;S.kinds=S.kinds.includes(x)?S.kinds.filter(y=>y!==x):[...S.kinds,x];render();return;}
  const vb=t.closest('#viewToggle button');if(vb){S.view=vb.dataset.v;LS('ircal-view',S.view);render();return;}
  if(t.closest('#prevBtn'))move(-1);else if(t.closest('#nextBtn'))move(1);
  else if(t.closest('#todayBtn')){S.cursor=S.today;render();}
  else if(t.closest('#qClear')){S.q='';$('q').value='';render();}
  else if(t.closest('#icsBtn'))exportIcs();
  else if(t.closest('#reloadBtn')||t.closest('#retryBtn'))load();
  else if(t.closest('#syncBtn')||t.closest('#logBtn')){S.log=true;renderModal();}
});
$('q').addEventListener('input',e=>{S.q=e.target.value;render();});
$('srcSel').addEventListener('change',e=>{S.src=e.target.value;render();});
$('hostSel').addEventListener('change',e=>{S.host=e.target.value;render();});
$('ovChk').addEventListener('change',e=>{S.overseas=e.target.checked;LS('ircal-ov',S.overseas?'1':'0');render();});
$('wkChk').addEventListener('change',e=>{S.weekend=e.target.checked;render();});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sel||S.log))close();});
load();
setInterval(()=>{S.today=kstToday();load();},3e5);
</script>
</body>
</html>
