<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업종 Breadth 레짐</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--line2:#30363d;--txt:#e6edf3;--sub:#8b949e;--faint:#6e7681;
--red:#f85149;--org:#ffa657;--grn:#3fb950;--blu:#58a6ff;--pur:#bc8cff;--yel:#d29922;--teal:#39d3bb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;padding:18px 20px 60px}
.wrap{max-width:1300px;margin:0 auto}
h1{font-size:19px;margin-bottom:2px}
h2{font-size:14.5px;margin:26px 0 8px;color:var(--txt)}
h2 small{font-weight:400;color:var(--faint);font-size:11.5px;margin-left:6px}
.sub{color:var(--sub);font-size:12px;margin-bottom:14px}
.sub b{color:var(--txt)}
.num{font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.sig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.sig .k{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.sig .k b{color:var(--txt);font-weight:600}
.sig .st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;border:1px solid}
.exp{font-size:26px;font-weight:700;line-height:1}
.exp small{font-size:12px;font-weight:400;color:var(--sub);margin-left:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--faint)}
.kv dd{color:var(--txt);min-width:0;overflow-wrap:anywhere}
.chg{font-size:11.5px;color:var(--sub);margin-top:8px}
.warn{color:var(--org);font-size:11.5px;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:120px}
.chip b{display:block;font-size:18px;line-height:1.2}
.chip span{font-size:11px;color:var(--sub)}
.chip small{display:block;font-size:10.5px;color:var(--faint)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar button{background:var(--bg);border:1px solid var(--line);color:var(--sub);font:inherit;font-size:11.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
.bar button.on{color:var(--txt);border-color:var(--blu);background:#13233a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cw{position:relative}
svg.ch{width:100%;height:300px;display:block}
svg.rib{width:100%;height:20px;display:block;margin-top:4px}
.tip{position:absolute;pointer-events:none;background:#0b0f14;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:11.5px;line-height:1.5;white-space:nowrap;display:none;z-index:5}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
th{color:var(--faint);font-weight:600;font-size:11px;text-align:right;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
th.l,td.l{text-align:left}
th.sort{cursor:pointer;user-select:none}
th.sort.on{color:var(--blu)}
td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.dim td{opacity:.55}
.g{color:var(--grn)}.r{color:var(--red)}.o{color:var(--org)}.b{color:var(--blu)}.f{color:var(--faint)}.y{color:var(--yel)}
.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);color:var(--sub);margin-left:5px;vertical-align:1px}
.tag.t3{color:var(--grn);border-color:#1f4d2a}.tag.t5{color:var(--blu);border-color:#1d3a5c}
.strip{display:inline-flex;gap:1px;vertical-align:middle}
.strip i{width:3px;height:12px;border-radius:1px;background:#2a3038}
.strip i.on{background:var(--grn)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid}
.more{margin-top:8px;background:none;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer}
.note{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:22px}
.note b{color:var(--sub)}
.rg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media(max-width:760px){.rg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rg div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--sub);min-width:0}
.rg b{display:block;font-size:12.5px;margin-bottom:2px}
#err{color:var(--red);font-size:13px}
</style></head><body><div class="wrap">
<h1>업종 Breadth 레짐</h1>
<div class="sub" id="sub">불러오는 중…</div>
<div id="err"></div>

<div class="hero">
  <div class="sig" id="sigConf"></div>
  <div class="sig" id="sigLive"></div>
</div>
<div class="chips" id="chips"></div>

<h2>Breadth 추이 <small>업종지수 중 120일 이동평균 위 비율 · 띠 = 일별 레짐</small></h2>
<div class="box">
  <div class="bar" id="rng">
    <button data-n="130">6개월</button><button data-n="250" class="on">1년</button><button data-n="750">3년</button><button data-n="0">전체</button>
    <div class="legend"><span><i style="background:var(--blu)"></i>Breadth</span><span><i style="background:#8b949e"></i>KOSPI(우축)</span></div>
  </div>
  <div class="cw" id="cw"><svg class="ch" id="ch"></svg><svg class="rib" id="rib"></svg><div class="tip" id="tip"></div></div>
</div>
<div class="rg" id="rg"></div>

<h2>업종 스냅샷 <small id="snapAsof"></small></h2>
<div class="tw"><table id="sec"></table></div>

<h2>월말 신호 이력 <small>월말 종가로 판단 → 다음 거래일부터 한 달 적용</small></h2>
<div class="tw"><table id="mon"></table></div>
<button class="more" id="monMore">전체 보기</button>

<div class="note" id="note"></div>
</div>
<script>
const ST={TREND:['추세','#3fb950'],NON_TREND:['비추세','#58a6ff'],RECOVERY_LEADER_PULLBACK:['회복 · 리더 눌림','#d29922'],
RECOVERY_CASH:['회복 · 현금','#8b949e'],CONTRARIAN_KOSPI:['역추세 · KOSPI','#bc8cff']};
const stName=(s,e)=>s==='CONTRARIAN_KOSPI'&&!e?'역추세 · 대기':(ST[s]||[s])[0];
const stCol=(s,e)=>s==='CONTRARIAN_KOSPI'&&!e?'#6e7681':(ST[s]||[,'#8b949e'])[1];
const f2=v=>v==null?'–':v.toFixed(2);
const pct=(v,d=1)=>v==null?'–':(v>0?'+':'')+v.toFixed(d)+'%';
const cls=v=>v==null?'f':v>0?'g':v<0?'r':'f';
const md=d=>d?d.slice(2).replace(/-/g,'.'):'–';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,RANGE=250;

fetch('data/brregime.json?v='+Math.floor(Date.now()/6e5)).then(r=>r.json()).then(j=>{D=j;render()}).catch(e=>{document.getElementById('err').textContent='데이터를 불러오지 못했습니다: '+e});

function badge(s,e){const c=stCol(s,e);return `<span class="badge" style="color:${c};border-color:${c}55;background:${c}14">${stName(s,e)}</span>`}
function tgt(h){if(!h.target||!h.target.length)return '<span class="f">없음 (현금)</span>';return h.target.map(esc).join(', ')}

function sigCard(el,h,title,extra){
  el.innerHTML=`<div class="k">${title}</div>
  <div class="st">${badge(h.state,h.exposure)}<div class="exp num">${h.exposure}%<small>주식 · 현금 ${h.cash}%</small></div></div>
  <dl class="kv">
    <dt>투자 대상</dt><dd>${tgt(h)}</dd>
    <dt>Breadth</dt><dd class="num">${f2(h.breadth)}% <span class="f">(${Math.round(h.breadth*D.n_sectors/100)}/${D.n_sectors})</span></dd>
    <dt>KOSPI 252일 DD</dt><dd class="num ${cls(h.dd)}">${f2(h.dd)}%</dd>
    <dt>RS Top3</dt><dd>${h.top3&&h.top3.length?h.top3.map((x,i)=>esc(x)+` <span class="f num">${pct(h.top3_rs[i])}</span>`).join(', '):'<span class="f">적격 업종 없음</span>'}</dd>
    ${h.candidates?`<dt>회복 후보</dt><dd>${h.candidates.length?h.candidates.map(esc).join(', '):'<span class="f">없음</span>'}</dd>`:''}
    ${h.top3_avg_rs!=null?`<dt>Top3 평균 RS</dt><dd class="num">${pct(h.top3_avg_rs)}</dd>`:''}
  </dl>${h.fake_non_trend?'<div class="warn">⚠ 약세 비추세 조건 충족(KOSPI 200일선 아래·6개월 약세·낙폭 확대) — 비중 하향 검토 구간</div>':''}${extra||''}`;
}

function render(){
  const c=D.confirmed,l=D.live;
  document.getElementById('sub').innerHTML=`기준일 <b>${D.asof}</b> · 업종지수 ${D.n_sectors}개 · 갱신 ${D.updated} · 월 1회 리밸런싱(월말 종가 판단)`;
  sigCard(document.getElementById('sigConf'),c,`이번 달 확정 · <b>${md(c.date)}</b> 신호 → <b>${md(c.effective)}</b>부터 적용`);
  if(D.month_end_today){
    document.getElementById('sigLive').innerHTML=`<div class="k">오늘이 월말 신호일입니다</div><div class="f" style="font-size:12.5px">왼쪽 확정 신호가 다음 거래일부터 적용됩니다.</div>`;
  }else{
    const chg=[];
    if(c.state!==l.state)chg.push(`상태 ${stName(c.state,c.exposure)} → ${stName(l.state,l.exposure)}`);
    if(c.exposure!==l.exposure)chg.push(`비중 ${c.exposure}% → ${l.exposure}%`);
    const ct=(c.target||[]).join(','),lt=(l.target||[]).join(',');if(ct!==lt)chg.push('투자 대상 변경');
    chg.push(`Breadth ${f2(c.breadth)}% → ${f2(l.breadth)}% (${pct(l.breadth-c.breadth,2).replace('%','%p')})`);
    sigCard(document.getElementById('sigLive'),l,`다음 달 예상 · <b>${md(l.date)}</b> 종가 기준 <span class="f">(월말 확정 전 참고)</span>`,
      `<div class="chg">${chg.length===1?'포지션 변화 없음 · ':''}${chg.join(' · ')}</div>`);
  }
  const s=D.series,i=s.d.length-1,n=s.n[i];
  const b5=s.b[Math.max(0,i-5)],b20=s.b[Math.max(0,i-20)];
  const kma=l.kospi_ma200,kl=s.k[i];
  document.getElementById('chips').innerHTML=[
    [`${n}/${D.n_sectors}`,'120일선 위 업종',`1주 전 ${Math.round(b5*D.n_sectors/100)} · 1개월 전 ${Math.round(b20*D.n_sectors/100)}`],
    [`${f2(s.b[i])}%`,'Breadth',`1주 ${pct(s.b[i]-b5,1).replace('%','%p')} · 1개월 ${pct(s.b[i]-b20,1).replace('%','%p')}`],
    [`<span class="${cls(s.dd[i])}">${f2(s.dd[i])}%</span>`,'KOSPI 252일 고점 대비',`종가 ${kl?kl.toLocaleString('ko-KR',{maximumFractionDigits:2}):'–'}`],
    [`<span class="${kl>=kma?'g':'r'}">${kl>=kma?'위':'아래'}</span>`,'KOSPI vs 200일선',`200일선 ${kma?kma.toLocaleString('ko-KR',{maximumFractionDigits:0}):'–'}`],
    [`<span class="${cls(l.kospi_6m)}">${pct(l.kospi_6m)}</span>`,'KOSPI 6개월 수익률',''],
  ].map(([b,t,sm])=>`<div class="chip"><span>${t}</span><b class="num">${b}</b>${sm?`<small class="num">${sm}</small>`:''}</div>`).join('');
  document.getElementById('rg').innerHTML=[
    ['TREND','60% 이상','RS 상위 업종 집중'],['NON_TREND','40~60%','주도 강도에 따라 비중 조절'],
    ['RECOVERY_LEADER_PULLBACK','30~40%','눌린 과거 리더만, 없으면 현금'],['CONTRARIAN_KOSPI','30% 미만','KOSPI 낙폭 따라 지수 분할 매수']
  ].map(([k,r,t])=>`<div><b style="color:${ST[k][1]}">${ST[k][0].split(' ·')[0]} <span class="f num" style="font-weight:400">${r}</span></b>${t}</div>`).join('');
  chart();secTable();monTable(false);
  document.getElementById('note').innerHTML=`<b>읽는 법</b> · Breadth = 업종지수 중 종가가 120일 이동평균 위에 있는 업종의 비율. 시장 내부가 얼마나 넓게 살아 있는지를 보는 지표로, 4개 구간에 따라 주식 비중과 투자 대상이 달라진다.
  판단은 매월 마지막 거래일 종가로 한 번만 하고 다음 거래일부터 한 달 보유한다. 오른쪽 '다음 달 예상'은 같은 규칙을 최신 종가에 적용한 참고값이며 월말에 확정된다.
  RS = 업종 6개월 수익률 − KOSPI 6개월 수익률(120일선 위·RS 양수 업종만 순위). 업종지수 종가는 장 마감 후 저녁에 반영된다.`;
}

function chart(){
  const s=D.series,N=s.d.length,st=RANGE?Math.max(0,N-RANGE):0;
  const d=s.d.slice(st),b=s.b.slice(st),k=s.k.slice(st);
  const svg=document.getElementById('ch'),W=svg.clientWidth||900,H=300,m={l:34,r:52,t:10,b:22};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=d.length;
  const x=i=>m.l+(n<2?0:i*iw/(n-1)),y=v=>m.t+ih*(1-v/100);
  const kv=k.filter(v=>v!=null),kmin=Math.min(...kv),kmax=Math.max(...kv),kp=(kmax-kmin)*.06||1;
  const yk=v=>m.t+ih*(1-(v-(kmin-kp))/((kmax+kp)-(kmin-kp)));
  let h=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  [[60,100,'#3fb950'],[40,60,'#58a6ff'],[30,40,'#d29922'],[0,30,'#bc8cff']].forEach(([a,c2,col])=>{h+=`<rect x="${m.l}" y="${y(c2)}" width="${iw}" height="${y(a)-y(c2)}" fill="${col}" opacity=".07"/>`});
  [0,30,40,60,100].forEach(v=>{h+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#30363d" ${v%100?'stroke-dasharray="3 3"':''}/><text x="${m.l-6}" y="${y(v)+4}" fill="#6e7681" font-size="10" text-anchor="end">${v}</text>`});
  for(let j=0;j<=4;j++){const v=kmin-kp+(kmax-kmin+2*kp)*j/4;h+=`<text x="${m.l+iw+6}" y="${yk(v)+4}" fill="#6e7681" font-size="10">${Math.round(v).toLocaleString()}</text>`}
  const step=Math.max(1,Math.round(n/6));let lastLab='';
  for(let i=0;i<n;i+=step){const lab=n>400?d[i].slice(0,7):d[i].slice(2,7).replace('-','.');if(lab===lastLab)continue;lastLab=lab;h+=`<text x="${x(i)}" y="${H-6}" fill="#6e7681" font-size="10" text-anchor="middle">${lab}</text>`}
  h+=`<polyline fill="none" stroke="#8b949e" stroke-width="1.1" opacity=".75" points="${k.map((v,i)=>v==null?'':x(i).toFixed(1)+','+yk(v).toFixed(1)).join(' ')}"/>`;
  h+=`<polyline fill="none" stroke="#58a6ff" stroke-width="1.7" points="${b.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  // 월말 신호점
  const me=new Map(D.monthly.map(r=>[r.date,r]));
  d.forEach((dd,i)=>{const r=me.get(dd);if(r)h+=`<circle cx="${x(i)}" cy="${y(b[i])}" r="2.6" fill="${stCol(r.state,r.exposure)}" stroke="#0d1117" stroke-width=".8"/>`});
  h+=`<line id="hx" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="#6e7681" stroke-dasharray="2 2" visibility="hidden"/></svg>`;
  svg.outerHTML=h.replace('<svg ','<svg class="ch" id="ch" ');
  // 레짐 띠 (일별 상태: 최근 260거래일만 계산됨)
  const smap=new Map(D.states.map(r=>[r[0],r]));const rib=document.getElementById('rib');
  let rh=`<svg viewBox="0 0 ${W} 20" xmlns="http://www.w3.org/2000/svg">`;const bw=iw/Math.max(1,n-1);
  d.forEach((dd,i)=>{const r=smap.get(dd);if(r)rh+=`<rect x="${x(i)-bw/2}" y="3" width="${bw+.4}" height="12" fill="${stCol(r[1],r[2])}" opacity=".8"/>`});
  rh+=`<text x="${m.l-6}" y="13" fill="#6e7681" font-size="9.5" text-anchor="end">레짐</text></svg>`;
  rib.outerHTML=rh.replace('<svg ','<svg class="rib" id="rib" ');
  const ch=document.getElementById('ch'),tip=document.getElementById('tip'),cw=document.getElementById('cw');
  ch.onmousemove=e=>{const r=ch.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;let i=Math.round((sx-m.l)/(iw/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
    const hx=document.getElementById('hx');hx.setAttribute('x1',x(i));hx.setAttribute('x2',x(i));hx.setAttribute('visibility','visible');
    const gi=st+i,sr=smap.get(d[i]),mr=me.get(d[i]);
    tip.innerHTML=`<b>${d[i]}</b>${mr?' <span class="y">월말 신호</span>':''}<br>Breadth <b>${f2(b[i])}%</b> (${s.n[gi]}/${D.n_sectors})<br>KOSPI ${k[i]!=null?k[i].toLocaleString():'–'} · DD ${f2(s.dd[gi])}%${sr?`<br>${stName(sr[1],sr[2])} · 주식 ${sr[2]}%`:''}`;
    tip.style.display='block';const px=(x(i)/W)*r.width;tip.style.left=Math.min(px+12,r.width-tip.offsetWidth-4)+'px';tip.style.top='10px'};
  ch.onmouseleave=()=>{tip.style.display='none';const hx=document.getElementById('hx');if(hx)hx.setAttribute('visibility','hidden')};
}
document.getElementById('rng').addEventListener('click',e=>{const bt=e.target.closest('button');if(!bt)return;
  document.querySelectorAll('#rng button').forEach(z=>z.classList.toggle('on',z===bt));RANGE=+bt.dataset.n;chart()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>D&&chart(),150)});

let SK='rs',SD=-1;
function secTable(){
  const t3=new Set(D.live.top3),t5=new Set(D.live.top5);
  document.getElementById('snapAsof').textContent=`${D.asof} 종가 · RS 순 · 녹색 막대 = 최근 60거래일 중 120일선 위였던 날`;
  const rows=[...D.sectors].sort((a,b)=>{const va=SK==='n'?a.n:a[SK],vb=SK==='n'?b.n:b[SK];if(va==null)return 1;if(vb==null)return -1;return (va>vb?1:va<vb?-1:0)*SD});
  const cols=[['n','업종','l'],['above','120일선'],['gap','이격'],['rs','RS 6M'],['pull','20일 고점 대비'],['r1m','1개월'],['hist','최근 60일','l']];
  let h='<thead><tr>'+cols.map(([k,t,a])=>`<th class="${a||''} ${k!=='hist'?'sort':''} ${SK===k?'on':''}" data-k="${k}">${t}${SK===k?(SD<0?' ▾':' ▴'):''}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+=`<tr class="${r.above?'':'dim'}"><td class="l">${esc(r.n)}${t3.has(r.n)?'<span class="tag t3">Top3</span>':t5.has(r.n)?'<span class="tag t5">Top5</span>':''}</td>
    <td>${r.above?'<span class="g">위</span>':'<span class="f">아래</span>'}</td><td class="${cls(r.gap)}">${pct(r.gap)}</td><td class="${cls(r.rs)}">${pct(r.rs)}</td>
    <td class="${cls(r.pull)}">${pct(r.pull)}</td><td class="${cls(r.r1m)}">${pct(r.r1m)}</td>
    <td class="l"><span class="strip">${r.above_hist.map(v=>`<i class="${v?'on':''}"></i>`).join('')}</span></td></tr>`});
  const tb=document.getElementById('sec');tb.innerHTML=h+'</tbody>';
  tb.querySelectorAll('th.sort').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(SK===k)SD=-SD;else{SK=k;SD=k==='n'?1:-1}secTable()});
}
function monTable(all){
  const rows=[...D.monthly].reverse().slice(0,all?9999:24);
  let h='<thead><tr><th class="l">신호일</th><th class="l">적용일</th><th class="l">레짐</th><th>Breadth</th><th>KOSPI DD</th><th>주식</th><th class="l">투자 대상</th><th class="l">RS Top3</th></tr></thead><tbody>';
  rows.forEach(r=>{const c=stCol(r.state,r.exposure);
    h+=`<tr><td class="l">${r.date}</td><td class="l f">${r.effective||'–'}</td><td class="l"><span class="pill" style="color:${c};border-color:${c}55">${stName(r.state,r.exposure)}</span></td>
    <td>${f2(r.breadth)}%</td><td class="${cls(r.dd)}">${f2(r.dd)}%</td><td><b>${r.exposure}%</b></td><td class="l">${tgt(r)}</td><td class="l f">${(r.top3||[]).map(esc).join(', ')||'–'}</td></tr>`});
  document.getElementById('mon').innerHTML=h+'</tbody>';
  const mb=document.getElementById('monMore');mb.style.display=all||D.monthly.length<=24?'none':'';mb.onclick=()=>monTable(true);
}
</script></body></html>
