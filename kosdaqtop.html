<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코스닥 시총 상위 × 영업이익 컨센서스</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--txt:#e6edf3;--sub:#8b949e;--faint:#6e7681;
--red:#f85149;--org:#ffa657;--grn:#3fb950;--blu:#58a6ff;--pur:#bc8cff;--yel:#d29922;--teal:#39d3bb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;padding:18px 20px 60px}
.wrap{max-width:1500px;margin:0 auto}
h1{font-size:19px;margin-bottom:2px}
.sub{color:var(--sub);font-size:12px;margin-bottom:12px}
.sub b{color:var(--txt)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:130px}
.chip b{display:block;font-size:19px;line-height:1.15}
.chip span{font-size:11px;color:var(--sub)}
.chip small{display:block;font-size:10.5px;color:var(--faint)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .lb{font-size:11px;color:var(--faint);margin-right:-4px}
.bar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;width:180px}
.filt{display:flex;gap:4px;flex-wrap:wrap}
.filt button{background:var(--card);border:1px solid var(--line);color:var(--sub);font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer}
.filt button.on{color:var(--txt);border-color:var(--blu);background:#13233a}
label.ck{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer}
.tw{overflow-x:auto;margin-bottom:22px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
th{color:var(--faint);font-weight:600;font-size:11px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;vertical-align:bottom;background:var(--card)}
th.grp{cursor:default;text-align:center;color:var(--sub);border-left:1px solid var(--line);padding:5px 8px 3px;font-size:10.5px;letter-spacing:.02em}
th.grp:first-child{border-left:0}
th.l,td.l{text-align:left}
th.s{color:var(--blu)}
th small{display:block;font-weight:400;font-size:10px;color:var(--faint)}
td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.gb,th.gb{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.stk,td.stk{position:sticky;left:0;z-index:2;background:var(--card);min-width:190px;box-shadow:1px 0 0 var(--line)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:#1c2129}
tbody tr.row.sel td{background:#13233a}
tbody tr.idx td{background:#0f1a2a;color:var(--sub);font-style:italic}
tbody tr.idx td.stk{color:var(--txt);font-style:normal}
tr.det td{background:#0f1319;padding:12px 14px 14px;white-space:normal;cursor:default;position:static}
.det{position:sticky;left:14px;max-width:calc(100vw - 72px)}
.up{color:var(--grn)}.dn{color:var(--red)}.new{color:var(--org);font-weight:600;font-size:11px}
.chg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--sub);line-height:1.8}
.chg b{color:var(--txt)}
.chg .k{color:var(--faint);font-size:11px;margin-right:6px}
.chg .it{display:inline-block;margin-right:10px;white-space:nowrap}
.det svg.rkc{height:110px}
.det svg.rkc polyline{fill:none;stroke:#58a6ff;stroke-width:1.6}
.det svg.rkc polyline.est{stroke:#6e7681;stroke-dasharray:3 3}
.det svg.rkc line{stroke:#30363d}
.nm{font-weight:600}
.rk{color:var(--faint);font-size:11px;margin-right:6px;display:inline-block;min-width:20px}
.cd{color:var(--faint);font-size:11px;margin-left:5px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin-left:4px;vertical-align:1px}
.tag.F{color:var(--yel);border-color:#5a4a1a}.tag.N{color:var(--faint)}
.g{color:var(--grn)}.r{color:var(--red)}.o{color:var(--org)}.b{color:var(--blu)}.f{color:var(--faint)}.y{color:var(--yel)}
.fl{font-size:10.5px;color:var(--org)}
.beat{font-weight:600}
.det .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:1150px){.det .grid{grid-template-columns:minmax(0,1fr)}}
.det td,.det th{white-space:nowrap}
.det table{font-size:12px;background:transparent;border:0;min-width:0;width:100%}
.det th{cursor:default;padding:4px 8px;position:static;min-width:0;box-shadow:none;background:transparent}
.det td{padding:4px 8px;position:static;min-width:0;box-shadow:none;background:transparent}
.det h4{font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.det .links{margin-top:10px;font-size:12px;color:var(--sub)}
.det a{color:var(--blu);text-decoration:none}
.det svg{width:100%;height:140px;display:block;margin:4px 0 8px}
.det svg text{fill:var(--sub);font-size:10px}
.det svg rect.a{fill:#58a6ff}.det svg rect.e{fill:#2f5a8a}.det svg rect.neg{fill:#8a3a3a}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:12.5px;color:var(--sub);line-height:1.7}
.note b{color:var(--txt)}
.note h3{font-size:13px;color:var(--txt);margin:0 0 6px}
.note ul{padding-left:18px}
.empty{padding:26px;text-align:center;color:var(--faint)}
.cnt{font-size:11.5px;color:var(--faint);margin-left:auto}
</style></head><body><div class="wrap">
<h1>코스닥 시총 상위 × 연간 영업이익 컨센서스</h1>
<div class="sub" id="hd">불러오는 중…</div>
<div class="chips" id="chips"></div>

<div class="bar">
  <span class="lb">순위 변동 기준</span><div class="filt" id="rb"></div>
  <label class="ck"><input type="checkbox" id="rel"> 수익률을 코스닥 지수 대비 초과수익으로</label>
  <input type="text" id="q" placeholder="종목명·코드 검색">
  <span class="cnt" id="cnt"></span>
</div>
<div class="bar">
  <span class="lb">정렬</span><div class="filt" id="sf"></div>
</div>

<div class="chg" id="chg"></div>
<div class="tw"><table id="tb"><thead></thead><tbody></tbody></table></div>

<div class="note" id="note"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let D=null, topN=50, sortK='mcap', sortD=-1, sel=null, rbase=1;   // 표시는 시총 상위 50 고정 (수집은 이탈 추적용 버퍼 포함)
const RB=[[1,'전일'],[5,'1주 (5거래일)'],[20,'1개월 (20거래일)']];
// 순위 변동: 이력(hist.rank[date][code])에서 기준일 순위를 찾아 Δ = 기준일 순위 − 현재 순위 (양수 = 상승)
function baseDate(){const ds=D.hist&&D.hist.dates||[];return ds.length>rbase?ds[ds.length-1-rbase]:null;}
function prevRank(code){const bd=baseDate();if(!bd)return undefined;return D.hist.rank[bd][code];}
function rkDelta(r){const p=prevRank(r.code);if(p===undefined)return null;return p-r.rank;}
function rkCell(r){const bd=baseDate();if(!bd)return '<span class="f">–</span>';const p=prevRank(r.code);
  if(p==null)return '<span class="new">NEW</span>';const d=p-r.rank;
  return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:'<span class="f">=</span>';}
const fd=d=>d?`${d.slice(4,6)}/${d.slice(6)}`:'';
const fmt=n=>n==null?'–':Math.round(n).toLocaleString();
const f1=n=>n==null?'–':n.toFixed(1);
const f2=n=>n==null?'–':n.toFixed(2);
const uk=n=>n==null?'–':n>=10000?(n/10000).toFixed(1)+'조':fmt(n)+'억';
const money=v=>v==null?'–':`<span class="${v<0?'r':''}">${fmt(v)}</span>`;
const pct=(g,fl)=>g==null?(fl?`<span class="fl">${fl}</span>`:'–'):`<span class="${g>0?'g':g<0?'r':''}">${g>0?'+':''}${g.toFixed(1)}%</span>`;
const RET=[['r1m','1M'],['r3m','3M'],['r6m','6M'],['ytd','YTD'],['r1y','1Y'],['r2y','2Y']];
const rv=(r,k)=>{const v=r[k];if(v==null)return null;return $('rel').checked&&D.index&&D.index[k]!=null?+(v-D.index[k]).toFixed(1):v;};
const retCell=(r,k)=>{const v=rv(r,k);if(v==null)return '–';const beat=!$('rel').checked&&D.index&&D.index[k]!=null&&r[k]>D.index[k];
  return `<span class="${v>0?'g':v<0?'r':''} ${beat?'beat':''}">${v>0?'+':''}${v.toFixed(1)}%</span>`;};

function filtered(){
  const q=$('q').value.trim().toLowerCase();
  return D.rows.filter(r=>r.rank<=topN&&(!q||r.name.toLowerCase().includes(q)||r.code.includes(q)));   // 컨센 없어도 시총 50위까지 전부
}
// 열 정의: [키, 라벨, 값함수, 그룹시작?]
const COLS=[
  ['rkd','순위 Δ<small id="rbl"></small>',r=>rkDelta(r)],['mcap','시총',r=>r.mcap],['price','현재가',r=>r.price],
  ...RET.map(([k,l],i)=>[k,l,r=>rv(r,k),i===0]),
  ['op1','2025A',r=>r.op[1],true],['op2','2026E',r=>r.op[2]],['op3','2027E',r=>r.op[3]],['op4','2028E',r=>r.op[4]],
  ['g1','25→26E',r=>r.g_op[1],true],['g2','26E→27E',r=>r.g_op[2]],['g3','27E→28E',r=>r.g_op[3]],['cagr','CAGR<small>25→28E</small>',r=>r.cagr],
  ['per26','PER<small>26E</small>',r=>r.per['26'],true],['per27','PER<small>27E</small>',r=>r.per['27']],['per28','PER<small>28E</small>',r=>r.per['28']],
  ['pbr_t','PBR<small>직전결산</small>',r=>r.pbr_t],['pbr26','PBR<small>26E</small>',r=>r.pbr26],
];
const CM=Object.fromEntries(COLS.map(c=>[c[0],c]));
const val=(r,k)=>k==='name'?r.name:k==='rank'?r.rank:CM[k][2](r);
const ASC=new Set(['rank','name','per26','per27','per28','pbr_t','pbr26']);
function render(){
  const rows=filtered();
  rows.sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);
    if(x==null&&y==null)return a.rank-b.rank; if(x==null)return 1; if(y==null)return -1;
    return typeof x==='string'?x.localeCompare(y)*sortD:(x-y)*sortD;});
  $('cnt').textContent=`${rows.length}종목`;
  const rel=$('rel').checked;
  const thead=$('tb').querySelector('thead');
  const bd=baseDate();
  thead.innerHTML=`<tr><th class="grp stk l" rowspan="2" data-k="name">종목 <small>시총 순위 · 클릭 정렬</small></th><th class="grp" colspan="3"></th>
    <th class="grp gb" colspan="6">주가 수익률${rel?' · 코스닥 지수 대비 초과':''}</th><th class="grp gb" colspan="4">영업이익 (억원)</th>
    <th class="grp gb" colspan="4">영업이익 증가율</th><th class="grp gb" colspan="5">밸류에이션 (현재가 기준)</th></tr>
    <tr>${COLS.map(([k,l,_,gb])=>`<th class="${gb?'gb':''} ${sortK===k?'s':''}" data-k="${k}">${l}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
  const rbl=document.getElementById('rbl'); if(rbl)rbl.textContent=bd?`${RB.find(x=>x[0]===rbase)[1].split(' ')[0]} ${fd(bd)} 대비${D.hist.est[bd]?' (추정)':''}`:'이력 없음';
  thead.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
    if(sortK===k)sortD=-sortD;else{sortK=k;sortD=ASC.has(k)?1:-1;}renderFilters();render();});
  const tb=$('tb').querySelector('tbody');
  const idx=D.index||{};
  const idxRow=`<tr class="idx"><td class="stk l"><span class="rk">–</span><span class="nm">코스닥 지수</span><span class="cd">${idx.px!=null?idx.px.toFixed(2):''}</span></td><td></td><td></td><td></td>
    ${RET.map(([k],i)=>`<td class="${i===0?'gb':''}">${rel?'0.0%':idx[k]==null?'–':`<span class="${idx[k]>0?'g':idx[k]<0?'r':''}">${idx[k]>0?'+':''}${idx[k].toFixed(1)}%</span>`}</td>`).join('')}
    <td class="gb" colspan="4" style="text-align:left;color:var(--faint)">기준일 ${D.asof} · 지수는 비교용</td><td class="gb" colspan="4"></td><td class="gb" colspan="5"></td></tr>`;
  if(!rows.length){tb.innerHTML=idxRow+`<tr><td colspan="${COLS.length+1}" class="empty">조건에 맞는 종목이 없습니다</td></tr>`;return;}
  tb.innerHTML=idxRow+rows.map(r=>`<tr class="row ${sel===r.code?'sel':''} ${r.cons?'':'nc'}" data-c="${r.code}">
    <td class="stk l"><span class="rk">${r.rank}</span><span class="nm">${r.name}</span><span class="cd">${r.code}</span>${r.fy&&r.fy!==12?`<span class="tag F">${r.fy}월 결산</span>`:''}${r.cons?'':'<span class="tag N">컨센 없음</span>'}${r.cons&&!r.full?'<span class="tag N">28E 없음</span>':''}</td>
    <td>${rkCell(r)}</td><td>${uk(r.mcap)}</td><td>${fmt(r.price)}</td>
    ${RET.map(([k],i)=>`<td class="${i===0?'gb':''}">${retCell(r,k)}</td>`).join('')}
    <td class="gb">${money(r.op[1])}</td><td>${money(r.op[2])}</td><td>${money(r.op[3])}</td><td>${money(r.op[4])}</td>
    <td class="gb">${pct(r.g_op[1],r.f_op[1])}</td><td>${pct(r.g_op[2],r.f_op[2])}</td><td>${pct(r.g_op[3],r.f_op[3])}</td><td>${pct(r.cagr,r.cons&&r.cagr==null&&r.op[1]!=null&&r.op[1]<=0?'기준 적자':'')}</td>
    <td class="gb">${f1(r.per['26'])}</td><td>${f1(r.per['27'])}</td><td>${f1(r.per['28'])}</td><td>${f2(r.pbr_t)}</td><td>${f2(r.pbr26)}</td>
  </tr>${sel===r.code?detail(r):''}`).join('');
  tb.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{sel=sel===tr.dataset.c?null:tr.dataset.c;render();});
}
function opChart(r){
  const ys=r.years, v=r.op, W=520, H=140, m={l:8,r:8,t:32,b:20}, n=ys.length;
  const vals=v.filter(x=>x!=null); if(!vals.length)return '';
  const hi=Math.max(0,...vals), lo=Math.min(0,...vals); const span=(hi-lo)||1;
  const y=val=>m.t+(hi-val)/span*(H-m.t-m.b), bw=(W-m.l-m.r)/n*0.56, step=(W-m.l-m.r)/n;
  let g=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="#30363d"/>`;
  ys.forEach((yr,i)=>{const x=m.l+step*i+(step-bw)/2; const val=v[i];
    const lab=`${String(yr).slice(2)}${r.isE[i]?'E':'A'}`;
    if(val==null){g+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${lab}</text><text x="${x+bw/2}" y="${y(0)-4}" text-anchor="middle" fill="#6e7681">–</text>`;return;}
    const top=Math.min(y(val),y(0)), h=Math.max(1,Math.abs(y(val)-y(0)));
    g+=`<rect class="${val<0?'neg':r.isE[i]?'e':'a'}" x="${x}" y="${top}" width="${bw}" height="${h}" rx="2"/>`;
    g+=`<text x="${x+bw/2}" y="${val>=0?top-4:top+h+11}" text-anchor="middle">${fmt(val)}</text><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${lab}</text>`;
    if(i>0&&r.g_op[i-1]!=null)g+=`<text x="${x+bw/2}" y="12" text-anchor="middle" fill="${r.g_op[i-1]>=0?'#3fb950':'#f85149'}">${r.g_op[i-1]>0?'+':''}${r.g_op[i-1].toFixed(0)}%</text>`;
    else if(i>0&&r.f_op[i-1])g+=`<text x="${x+bw/2}" y="12" text-anchor="middle" fill="#ffa657">${r.f_op[i-1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}
function detail(r){
  const ys=r.years, hdr=ys.map((y,i)=>`<th>${y}${r.isE[i]?'E':'A'}</th>`).join('');
  const line=(l,arr,u)=>`<tr><th class="l">${l}</th>${arr.map(v=>`<td>${v==null?'–':u(v)}</td>`).join('')}</tr>`;
  const p=v=>v.toFixed(1)+'%', w=v=>fmt(v)+'원', mn=v=>`<span class="${v<0?'r':''}">${fmt(v)}</span>`;
  const perRow=ys.map(y=>r.per[String(y).slice(2)]), pbrRow=r.bps.map(b=>b&&b>0&&r.price?r.price/b:null);
  const idx=D.index||{};
  return `<tr class="det"><td colspan="${COLS.length+1}"><div class="det"><div class="grid">
  <div><h4>컨센서스 (억원) · ${r.name} · 영업이익(발표기준) · 지배주주순이익</h4>
  ${r.cons?opChart(r):'<div class="f" style="font-size:12px;margin:4px 0 8px">26E·27E 영업이익 컨센서스 없음 — 확정 실적만 표시</div>'}
  <table><thead><tr><th class="l"></th>${hdr}</tr></thead><tbody>
  ${line('매출액',r.sales,mn)}${line('영업이익',r.op,mn)}${line('영업이익률',r.opm,p)}${line('지배순이익',r.np,mn)}${line('ROE',r.roe,p)}
  ${line('EPS',r.eps,w)}${line('BPS',r.bps,w)}${line('DPS',r.dps,w)}
  ${line('PER @현재가',perRow,v=>v.toFixed(1)+'배')}${line('PBR @현재가',pbrRow,v=>v.toFixed(2)+'배')}
  </tbody></table></div>
  <div><h4>시총 순위 추이 (점선 = 종가×상장주식수 역산 추정, 실선 = 실측)</h4>${rankChart(r)||'<div class="f" style="font-size:12px">이력 없음</div>'}
  <h4 style="margin-top:8px">주가 · 밸류에이션 (현재가 ${fmt(r.price)}원 · ${r.pdate||''})</h4>
  <table><thead><tr><th class="l"></th>${RET.map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
  <tr><th class="l">${r.name}</th>${RET.map(([k])=>`<td>${r[k]==null?'–':`<span class="${r[k]>0?'g':r[k]<0?'r':''}">${r[k]>0?'+':''}${r[k].toFixed(1)}%</span>`}</td>`).join('')}</tr>
  <tr><th class="l">코스닥 지수</th>${RET.map(([k])=>`<td class="f">${idx[k]==null?'–':(idx[k]>0?'+':'')+idx[k].toFixed(1)+'%'}</td>`).join('')}</tr>
  <tr><th class="l">초과수익</th>${RET.map(([k])=>{const v=r[k]!=null&&idx[k]!=null?r[k]-idx[k]:null;return `<td>${v==null?'–':`<span class="${v>0?'g':v<0?'r':''}">${v>0?'+':''}${v.toFixed(1)}%p</span>`}</td>`}).join('')}</tr>
  </tbody></table>
  <table style="margin-top:10px"><tbody>
  <tr><th class="l">시가총액</th><td>${uk(r.mcap)}</td><th class="l">코스닥 시총 순위</th><td>${r.rank}위</td></tr>
  <tr><th class="l">PBR 직전결산</th><td>${f2(r.pbr_t)}배 <span class="f">(BPS ${r.bps_year||''} ${r.bps_t!=null?fmt(r.bps_t)+'원':''})</span></td><th class="l">PBR 26E / 27E</th><td>${f2(r.pbr26)} / ${f2(r.pbr27)}배</td></tr>
  <tr><th class="l">PER 25A / 26E / 27E / 28E</th><td colspan="3">${f1(r.per['25'])} / ${f1(r.per['26'])} / ${f1(r.per['27'])} / ${f1(r.per['28'])}배</td></tr>
  <tr><th class="l">OP 증가율</th><td colspan="3">24→25 ${r.g_op[0]==null?(r.f_op[0]||'–'):(r.g_op[0]>0?'+':'')+r.g_op[0].toFixed(1)+'%'} · 25→26E ${r.g_op[1]==null?(r.f_op[1]||'–'):(r.g_op[1]>0?'+':'')+r.g_op[1].toFixed(1)+'%'} · 26E→27E ${r.g_op[2]==null?(r.f_op[2]||'–'):(r.g_op[2]>0?'+':'')+r.g_op[2].toFixed(1)+'%'} · 27E→28E ${r.g_op[3]==null?(r.f_op[3]||'–'):(r.g_op[3]>0?'+':'')+r.g_op[3].toFixed(1)+'%'} · 3년 CAGR ${r.cagr==null?'–':r.cagr.toFixed(1)+'%'}</td></tr>
  <tr><th class="l">배당수익률 26E</th><td colspan="3">${r.dy26==null?'–':r.dy26.toFixed(2)+'%'}</td></tr>
  </tbody></table>
  <div class="links"><a href="https://finance.naver.com/item/main.naver?code=${r.code}" target="_blank" rel="noopener">네이버 종목 ↗</a> · <a href="https://navercomp.wisereport.co.kr/v2/company/c1010001.aspx?cmp_cd=${r.code}" target="_blank" rel="noopener">컨센서스 원표 ↗</a> · <a href="https://dart.fss.or.kr/dsab007/main.do?option=corp&textCrpNm=${encodeURIComponent(r.name)}" target="_blank" rel="noopener">DART ↗</a></div>
  </div></div></div></td></tr>`;
}
function renderFilters(){
  const mkb=(id,items,cur,set)=>{$(id).innerHTML=items.map(([k,l])=>`<button class="${String(cur)===String(k)?'on':''}" data-k="${k}">${l}</button>`).join('');
    $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{set(b.dataset.k);renderFilters();render();});};
  mkb('rb',RB.map(([k,l])=>[k,l]),rbase,v=>rbase=+v);
  mkb('sf',[['mcap','시총'],['rkd','순위 변동'],['ytd','YTD'],['r1y','1Y'],['r1m','1M'],['g2','OP 26E→27E'],['g3','OP 27E→28E'],['cagr','OP CAGR'],['per26','PER 26E'],['per27','PER 27E'],['pbr_t','PBR']],sortK,v=>{sortK=v;sortD=ASC.has(v)?1:-1;});
}
function changes(){
  const bd=baseDate(), box=$('chg');
  if(!bd){box.innerHTML=`<span class="k">순위 변동</span>이력 누적 중 — 첫 기록 ${fd(D.asof)}. 다음 빌드부터 전일 대비 변동이 표시됩니다.`;return;}
  const cur=D.rows.filter(r=>r.rank<=topN), prev=D.hist.rank[bd], names=D.hist.names||{};
  const byCode=Object.fromEntries(D.rows.map(r=>[r.code,r]));
  const ins=cur.filter(r=>{const p=prev[r.code];return p==null||p>topN;});
  const outs=Object.entries(prev).filter(([c,p])=>p<=topN&&(!byCode[c]||byCode[c].rank>topN)).sort((a,b)=>a[1]-b[1]);
  const mv=cur.map(r=>[r,rkDelta(r)]).filter(x=>x[1]!=null&&x[1]!==0);
  const up=mv.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6), dn=mv.filter(x=>x[1]<0).sort((a,b)=>a[1]-b[1]).slice(0,6);
  const it=(r,d)=>`<span class="it"><b>${r.name}</b> <span class="${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d)}</span> <span class="f">(${prevRank(r.code)}→${r.rank})</span></span>`;
  box.innerHTML=`<div><span class="k">순위 변동 · 상위 ${topN} · ${RB.find(x=>x[0]===rbase)[1]} ${fd(bd)} → ${fd(D.asof)}${D.hist.est[bd]?' <span class="y">(기준일 순위는 종가×상장주식수 역산 추정)</span>':''}</span></div>
  <div><span class="k">진입 ${ins.length}</span>${ins.length?ins.map(r=>`<span class="it"><b>${r.name}</b> <span class="new">${prev[r.code]==null?'NEW':prev[r.code]+'→'+r.rank}</span></span>`).join(''):'<span class="f">없음</span>'}</div>
  <div><span class="k">이탈 ${outs.length}</span>${outs.length?outs.map(([c,p])=>`<span class="it"><b>${byCode[c]?byCode[c].name:names[c]||c}</b> <span class="dn">${p}→${byCode[c]?byCode[c].rank:D.top+'위 밖'}</span></span>`).join(''):'<span class="f">없음</span>'}</div>
  <div><span class="k">상승</span>${up.length?up.map(([r,d])=>it(r,d)).join(''):'<span class="f">없음</span>'}</div>
  <div><span class="k">하락</span>${dn.length?dn.map(([r,d])=>it(r,d)).join(''):'<span class="f">없음</span>'}</div>`;
}
function rankChart(r){
  const ds=D.hist&&D.hist.dates||[]; if(ds.length<2)return '';
  const pts=ds.map((d,i)=>[i,D.hist.rank[d][r.code],D.hist.est[d]]);
  const W=520,H=110,m={l:28,r:10,t:12,b:16}; const vals=pts.filter(p=>p[1]!=null).map(p=>p[1]); if(!vals.length)return '';
  const lo=Math.max(1,Math.min(...vals)-2), hi=Math.max(...vals)+2;
  const x=i=>m.l+i/(ds.length-1)*(W-m.l-m.r), y=v=>m.t+(v-lo)/(hi-lo)*(H-m.t-m.b);
  const P=p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`;
  const firstReal=pts.find(p=>p[1]!=null&&!p[2]);
  const estPts=pts.filter(p=>p[1]!=null&&(p[2]||(firstReal&&p[0]===firstReal[0])));
  const realPts=firstReal?pts.filter(p=>p[1]!=null&&p[0]>=firstReal[0]):[];
  const last=pts.filter(p=>p[1]!=null).slice(-1)[0];
  let g=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(lo)}" y2="${y(lo)}"/><line x1="${m.l}" x2="${W-m.r}" y1="${y(hi)}" y2="${y(hi)}"/>`;
  g+=`<polyline class="est" points="${estPts.map(P).join(' ')}"/><polyline points="${realPts.map(P).join(' ')}"/>`;
  g+=`<text x="${m.l-4}" y="${y(lo)+3}" text-anchor="end">${lo}위</text><text x="${m.l-4}" y="${y(hi)+3}" text-anchor="end">${hi}위</text>`;
  g+=`<text x="${m.l}" y="${H-3}">${fd(ds[0])}</text><text x="${W-m.r}" y="${H-3}" text-anchor="end">${fd(ds[ds.length-1])} · ${last[1]}위</text>`;
  if(firstReal)g+=`<text x="${x(firstReal[0])}" y="${m.t-3}" text-anchor="middle">실측 ${fd(ds[firstReal[0]])}~</text>`;
  return `<svg class="rkc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}
function chips(){
  const top=D.rows.filter(r=>r.rank<=topN), c=top.filter(r=>r.cons), f=top.filter(r=>r.full);
  const sum=i=>f.reduce((s,r)=>s+(r.op[i]||0),0);
  const s25=sum(1),s26=sum(2),s27=sum(3),s28=sum(4);
  const med=a=>{const v=a.filter(x=>x!=null).sort((x,y)=>x-y);return v.length?v[Math.floor(v.length/2)]:null;};
  const noc=top.filter(r=>!r.cons).map(r=>r.name);
  const gp=(a,b)=>a>0?`${b/a-1>0?'+':''}${((b/a-1)*100).toFixed(0)}%`:'–';
  $('chips').innerHTML=[
    [c.length,`상위 ${topN} 중 컨센 보유`,noc.length?`미보유 ${noc.length}: ${noc.slice(0,6).join('·')}${noc.length>6?' 외':''}`:'전 종목 보유'],
    [`${uk(s26)}`,`합산 영업이익 26E (${f.length}종목)`,`25A ${uk(s25)} → 27E ${uk(s27)} → 28E ${uk(s28)}`],
    [`${gp(s25,s26)} · ${gp(s26,s27)} · ${gp(s27,s28)}`,'합산 OP 증가율 25→26E · 26→27E · 27→28E','28E까지 컨센 있는 종목 합산'],
    [`${f1(med(c.map(r=>r.per['26'])))} / ${f1(med(c.map(r=>r.per['27'])))}배`,'PER 26E / 27E 중간값','PER은 EPS 양수 종목만'],
    [`${(()=>{const m=med(top.map(r=>r.ytd));return m==null?'–':(m>0?'+':'')+m.toFixed(1)+'%'})()}`,`YTD 수익률 중간값 (상위 ${topN})`,`코스닥 지수 YTD ${D.index&&D.index.ytd!=null?(D.index.ytd>0?'+':'')+D.index.ytd.toFixed(1)+'%':'–'}`],
  ].map(([n,l,s])=>`<div class="chip"><b>${n}</b><span>${l}</span><small>${s}</small></div>`).join('');
}
fetch('data/kosdaqtop.json?v='+Math.floor(Date.now()/6e5)).then(r=>r.json()).then(d=>{
  D=d;
  $('hd').innerHTML=`기준일 <b>${d.asof}</b> · 빌드 ${d.built} · 코스닥 보통주 <b>${d.n_kosdaq.toLocaleString()}</b>종목 중 시총 상위 <b>50</b> · 26E·27E 영업이익 컨센 보유 <b>${d.rows.filter(r=>r.rank<=50&&r.cons).length}</b> (28E까지 ${d.rows.filter(r=>r.rank<=50&&r.full).length}) · 단위 억원 · 수익률은 수정주가 일봉 기준`;
  renderFilters(); chips(); changes(); render();
  $('q').oninput=render; $('rel').onchange=render;
  const _rf=renderFilters; renderFilters=function(){_rf();chips();changes();};
  $('note').innerHTML=`<h3>방법론</h3><ul>
  <li><b>유니버스</b> 코스닥 보통주(스팩·우선주·거래정지 제외) 시가총액 상위 50 고정. 순위는 빌드 시점 시총 기준. 50위 밖으로 밀린 종목의 현재 순위를 보여주기 위해 ${d.top}위까지만 뒤에서 수집한다.</li>
  <li><b>순위 변동</b> 매 빌드(평일 20:15)의 시총 순위를 일별로 누적해 전일·1주(5거래일)·1개월(20거래일) 전 순위와 비교. ▲=상승, ▼=하락, NEW=기준일에 수집 범위(상위 ${d.top}) 밖이던 종목. 진입·이탈은 50위 경계 기준. 첫 가동일(${fd(d.hist&&d.hist.dates.find(x=>!d.hist.est[x])||d.asof)}) 이전 구간은 <b>종가 × 현재 상장주식수로 역산한 추정 순위</b>(수집 집합 안에서만 매긴 근사치, 상장주식수 변동 미반영)이며 '(추정)'으로 표기. 이후는 실측이 쌓인다.</li>
  <li><b>영업이익</b> 증권사 컨센서스 연간 표의 영업이익(발표기준). 2025A는 확정 실적, 2026E·2027E·2028E는 추정 평균. 추정 기관 수는 표기되지 않으므로 <b>1개 증권사 추정만으로 잡힌 종목</b>도 포함될 수 있다(시총 작을수록 의심). <b>컨센이 없는 종목도 시총 순위대로 50위까지 모두 표시</b>하며 컨센 열은 –, 「컨센 없음」 태그를 단다. 컨센 열로 정렬하면 이 종목들은 맨 아래로 간다.</li>
  <li><b>증가율</b> = 다음 해 ÷ 전 해 − 1. 기준연도가 적자면 비율이 무의미하므로 흑전·적전·적지·적확으로 표기. CAGR은 2025A→2028E 3년 연복리(양수 쌍만).</li>
  <li><b>수익률</b> 수정주가 일봉 기준 — 1M·3M·6M·1Y·2Y는 달력 기준 같은 날짜(휴장이면 직전 거래일) 종가 대비, YTD는 전년 말 종가 대비. 굵은 글씨 = 같은 기간 코스닥 지수를 이김. 「지수 대비」 체크 시 초과수익(%p)으로 전환. 2026-09-14부터 일봉 종가는 KRX 애프터마켓(20:00) 마지막 체결가.</li>
  <li><b>PER</b> = 현재가 ÷ 해당 연도 EPS(EPS 양수일 때만). <b>PBR</b> 직전 결산 BPS와 26E BPS 두 기준. 현재가·시총은 네이버 기준(장중이면 장중가).</li>
  <li><b>3월 결산</b> 종목은 연도 숫자로 매핑(2026E = FY2026.03). 태그로 표시.</li>
  <li><b>갱신</b> 평일 20:15 자동(애프터마켓 종료 후 당일 종가 확정, 이 시점 순위가 그날의 기록) + 수동 갱신 버튼(낮에 누르면 장중 시총으로 그날 기록이 잠시 덮이고 20:15에 다시 확정). 컨센서스는 실적 시즌 직후 가장 크게 움직인다.</li></ul>`;
}).catch(e=>{$('hd').textContent='데이터 로드 실패: '+e;});
</script></body></html>
