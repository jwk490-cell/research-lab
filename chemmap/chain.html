<script>
/* 리서치랩 테마 연동: 상위 사이트의 rl-theme(기본 다크)를 따르고, 토글하면 storage 이벤트로 즉시 반영 */
(function(){var qt=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];function ap(){var t='dark';try{t=localStorage.getItem('rl-theme')||'dark';}catch(e){}if(qt)t=qt;document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
ap();window.addEventListener('storage',function(e){if(e.key==='rl-theme'){ap();if(window.redraw)redraw();}});})();
/* 화면 폭 맞춤: 배율 1에서 배치를 계산한 뒤 캔버스만 축소 (최소 0.55, 그보다 좁으면 가로 스크롤) */
window.preZoom=function(){var c=document.getElementById('canvas');if(c)c.style.zoom=1;};
window.fitZoom=function(){var c=document.getElementById('canvas');if(!c)return;var a=document.documentElement.clientWidth-24;c.style.zoom=Math.max(.55,Math.min(1,a/1640));};
window.addEventListener('resize',function(){window.fitZoom();});
</script>
<title>화학 밸류체인 지도</title>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--ring:rgba(11,11,11,.10);--cn:#e34948;--kr:#4a3aa7;--o1:#a9a8a1;--o2:#c3c2b7;--o3:#d6d5ce;--etc:#e9e8e2;--up:#c0362c;--dn:#1c5cab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0d0d;--surface:#1a1a19;--card:#20201f;--ink:#fff;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--cn:#e66767;--kr:#9085e9;--o1:#6b6a65;--o2:#55544f;--o3:#454540;--etc:#363632;--up:#ff7b72;--dn:#6da7ec}}
:root[data-theme="dark"]{--page:#0d0d0d;--surface:#1a1a19;--card:#20201f;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
--ring:rgba(255,255,255,.10);--cn:#e66767;--kr:#9085e9;--o1:#6b6a65;--o2:#55544f;--o3:#454540;--etc:#363632;--up:#ff7b72;--dn:#6da7ec}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif}
.wrap{overflow-x:auto;padding:16px}
#canvas{position:relative;width:1640px;margin:0 auto;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--ring)}
header{position:absolute;left:28px;top:22px;right:28px}
h1{margin:0;font-size:26px;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink2);align-items:center}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ln{display:inline-block;width:26px;border-top:2px solid var(--ink2);margin-right:6px;vertical-align:3px}
.legend .ln.alt{border-top-style:dashed}
.legend .ln.sub{border-top:2px dotted var(--ink2)}
.theses{position:absolute;right:28px;top:22px;width:600px;display:grid;grid-template-columns:1fr;gap:6px}
.th{background:var(--card);box-shadow:0 0 0 1px var(--ring);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;color:var(--ink2)}
.th b{color:var(--ink);font-size:12.5px}
.th .sws{display:inline-flex;gap:3px;margin-right:6px;vertical-align:-1px}
.th .sws i{width:10px;height:10px;border-radius:2px;display:inline-block}
.colh{position:absolute;top:172px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.5px}
svg#links{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;background:var(--card);border-radius:9px;box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.04);
  border-left:5px solid var(--f);padding:7px 10px 7px 10px;cursor:pointer;transition:box-shadow .15s}
.node:hover{box-shadow:0 0 0 2px var(--f)}
.node .nm{font-weight:700;font-size:14.5px;line-height:1.15}
.node .en{color:var(--muted);font-size:11px;font-weight:500;margin-left:4px}
.node .wow{font-size:11px;font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.wow.up{color:var(--up)}.wow.dn{color:var(--dn)}.wow.fl{color:var(--muted)}
.node .u1{font-size:11.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{position:absolute;border-radius:10px;padding:9px 11px;background:var(--card);box-shadow:0 0 0 1px var(--ring);border-top:4px solid var(--f)}
.src .ic{font-size:22px;line-height:1}
.src .nm{font-weight:700;font-size:14px;margin-top:3px}
.src .s{font-size:11px;color:var(--muted);margin-top:2px}
.prod{display:grid;grid-template-columns:190px 250px 1fr;gap:12px;align-items:center}
.uses{display:flex;flex-direction:column;gap:3px}
.use{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink)}
.use .e{font-size:22px;width:26px;text-align:center;line-height:1}
.bar{display:flex;height:12px;gap:2px;border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}
.bl{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.35;font-variant-numeric:tabular-nums}
.bl b{font-weight:700}
.bl .c{color:var(--cn);font-weight:700}.bl .k{color:var(--kr);font-weight:700}
.basis{font-size:10px;color:var(--muted);margin-top:2px}
.krs{font-size:11px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{position:absolute;left:28px;right:28px;bottom:14px;font-size:10.5px;color:var(--muted);line-height:1.5}
/* modal */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#dlg.on{display:flex}
#dlg .box{background:var(--card);color:var(--ink);border-radius:12px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#dlg h3{margin:0 0 4px;font-size:19px}
#dlg table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
#dlg td{padding:4px 6px;border-bottom:1px solid var(--grid)}
#dlg td.n{text-align:right;font-variant-numeric:tabular-nums}
#dlg .k{color:var(--muted);font-size:12px;margin-top:10px}
#dlg button{float:right;border:0;background:var(--grid);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}

/* ── Research Lab 테마 토큰 ── */
:root[data-theme="light"]{--page:#f2f4f6;--surface:#ffffff;--card:#ffffff;--ink:#191f28;--ink2:#4e5968;--muted:#8b95a1;--grid:#e7eaee;

:root[data-theme="dark"]{--page:#101014;--surface:#1a1b20;--card:#202128;--ink:#e9ebee;--ink2:#9aa2ad;--muted:#6d7480;--grid:#272930;

*,*::before,*::after{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif}
.wrap{padding:12px}
#canvas{border-radius:14px}

['원료','기초유분','중간체','최종 제품 · 용도 · 글로벌 생산 점유율'].forEach((t,i)=>{
  const h=document.createElement('div');h.className='colh';h.style.left=X[i]+'px';h.textContent=t;C.appendChild(h);});

function wowCls(w){ if(!w) return 'fl'; if(w.startsWith('+')) return 'up'; if(w.startsWith('-')) return 'dn'; return 'fl'; }
function shareBar(id, compact){
  const s = D.shares[id]; if(!s || !s.share) return `<div class="basis">${s && s.basis ? s.basis : "점유율 조사 중"}</div>`;
  const others = ['--o1','--o2','--o3']; let oi = 0;
  const segs = s.share.map(([c,p]) => {
    const col = c==='중국' ? 'var(--cn)' : c==='한국' ? 'var(--kr)' : c==='기타' ? 'var(--etc)' : `var(${others[Math.min(oi++,2)]})`;
    return `<i style="width:${p}%;background:${col}" title="${c} ${p}%"></i>`;}).join('');
  const lim = compact ? 3 : 6;
  const lab = s.share.filter(([c])=>c!=='기타').slice(0,lim).map(([c,p]) => {
    const cl = c==='중국'?'c':c==='한국'?'k':''; return `<span class="${cl}">${c} ${fmt(p)}</span>`;}).join(' · ');
  const kr = s.share.find(([c])=>c==='한국');
  const krTxt = compact && kr && !s.share.slice(0,lim).some(([c])=>c==='한국') ? ` · <span class="k">한국 ${fmt(kr[1])}</span>` : '';
  return `<div class="bar">${segs}</div><div class="bl">${lab}${krTxt}</div>` + (compact?'':`<div class="basis">${s.basis||''}</div>`);
}
function shortKr(k){ const a=k.split(/,\s*(?![^()]*\))/).map(x=>x.replace(/\s*\(.*?\)/g,'').trim()); return a.slice(0,3).join(', ')+(a.length>3?' 외':''); }
function fmt(p){ return (Math.round(p*10)/10)+'%'; }

function place(el, col, row, h){ el.style.left=X[col]+'px'; el.style.top=(TOP+row*RH)+'px'; el.style.width=W[col]+'px'; if(h) el.style.minHeight=h+'px'; C.appendChild(el); }

D.sources.forEach(s=>{
  const el=document.createElement('div'); el.className='src'; el.style.setProperty('--f',F[s.feed].color);
  el.innerHTML=`<div class="ic">${s.icon}</div><div class="nm">${s.name}</div><div class="s">${s.sub}</div>`;
  place(el,s.col,s.row); byId[s.id]={el,col:s.col};
});
D.nodes.forEach(n=>{
  const el=document.createElement('div'); el.className='node'; el.style.setProperty('--f',F[n.feed].color);
  const head=`<div class="nm">${n.name}<span class="en">${n.en}</span></div><div class="wow ${wowCls(n.wow)}" style="margin:2px 0 0">주간 ${n.wow}</div>`;
  const kr = (D.shares[n.id]||{}).kr;
  if(n.col===3){
    el.innerHTML=`<div class="prod"><div>${head}${kr?`<div class="krs">🇰🇷 ${shortKr(kr)}</div>`:''}</div>
      <div class="uses">${n.uses.map(u=>`<div class="use"><span class="e">${u[0]}</span>${u[1]}</div>`).join('')}</div>
      <div>${shareBar(n.id,false)}</div></div>`;
    place(el,3,n.row,80);
  } else {
    el.innerHTML=`${head}<div class="u1">${n.uses[0][0]} ${n.uses[0][1]}</div>${shareBar(n.id,true)}`;
    place(el,n.col,n.row);
  }
  el.onclick=()=>openDlg(n);
  byId[n.id]={el,col:n.col,node:n};
});

function resolve(){
  const cols={}; Object.values(byId).forEach(o=>{(cols[o.col]=cols[o.col]||[]).push(o.el);});
  Object.values(cols).forEach(a=>{ a.sort((x,y)=>x.offsetTop-y.offsetTop); let lim=0;
    a.forEach(e=>{ if(e.offsetTop<lim) e.style.top=lim+'px'; lim=e.offsetTop+e.offsetHeight+12; }); });
}
function layoutLinks(){ resolve();
  const svg=document.getElementById('links');
  const H=Math.max(...[...C.querySelectorAll('.node,.src')].map(e=>e.offsetTop+e.offsetHeight))+70;
  C.style.height=H+'px'; svg.setAttribute('width',1640); svg.setAttribute('height',H);
  const feedOf=id=>{const s=D.sources.find(x=>x.id===id); if(s) return s.feed; return D.nodes.find(x=>x.id===id).feed;};
  svg.innerHTML=D.links.map(([a,b,st])=>{
    const A=byId[a].el,B=byId[b].el;
    let x1=A.offsetLeft+A.offsetWidth,y1=A.offsetTop+A.offsetHeight/2,x2=B.offsetLeft,y2=B.offsetTop+B.offsetHeight/2;
    if(st==='sub'){ // 천연고무 → SBR: 오른쪽 바깥으로 돌아가는 대체재 표시
      x1=A.offsetLeft+60; y1=A.offsetTop; x2=B.offsetLeft+60; y2=B.offsetTop+B.offsetHeight;
      return `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${cssv('--ink2')}" stroke-width="2" stroke-dasharray="2 4" fill="none"/>`;
    }
    const mx=(x1+x2)/2, col=F[feedOf(a)].color;
    const dash=st==='alt'?'stroke-dasharray="6 5"':'';
    return `<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" stroke="${col}" stroke-opacity="${st==='alt'?.75:.55}" stroke-width="2" ${dash} fill="none"/>`;
  }).join('');
  const ft=document.createElement('div'); ft.className='foot';
  ft.innerHTML='가격 변화: 하나증권 에너지/화학 Weekly Monitor(2026.11.02) 주간 WoW, NB라텍스는 9월 수출단가 MoM · 원료 기반 분류·투자 논리: 자체 정리 · 국가 점유율: 칸을 눌러 출처·기준연도 확인 (생산능력 기준, 기관마다 차이 있음)';
  C.appendChild(ft);
}
function openDlg(n){
  const s=D.shares[n.id]||{};
  const rows=(s.share||[]).map(([c,p])=>`<tr><td>${c}</td><td class="n">${fmt(p)}</td></tr>`).join('');
  document.getElementById('dbox').innerHTML=`<button onclick="document.getElementById('dlg').classList.remove('on')">닫기</button>
   <h3>${n.name} <span style="color:var(--muted);font-size:13px">${n.en}</span></h3>
   <div style="font-size:13px;color:var(--ink2)"><span style="color:${F[n.feed].color};font-weight:700">■ ${F[n.feed].label}</span> — ${F[n.feed].desc}</div>
   <div class="k">용도</div><div style="font-size:14px">${n.uses.map(u=>u[0]+' '+u[1]).join('<br>')}${s.uses?`<div style="font-size:12px;color:var(--ink2);margin-top:4px">${s.uses}</div>`:''}</div>
   <div class="k">글로벌 생산 점유율 ${s.basis?'('+s.basis+')':''}</div>${rows?`<table>${rows}</table>`:'<div>조사 중</div>'}
   ${s.total?`<div style="font-size:12px;color:var(--ink2)">글로벌 규모: ${s.total}</div>`:''}
   ${s.route?`<div class="k">원료 경로</div><div style="font-size:13px">${s.route}</div>`:''}
   ${s.kr?`<div class="k">한국 상장사</div><div style="font-size:13px">${s.kr}</div>`:''}
   <div class="k">이번 주 가격 (하나증권 11/2)</div><div style="font-size:13px">${n.wow} · 관련 도표 ${n.figs.join(', ')}</div>
   ${s.src?`<div class="k">출처</div><div style="font-size:11.5px;color:var(--ink2);word-break:break-all">${s.src}</div>`:''}`;
  document.getElementById('dlg').classList.add('on');
}
document.getElementById('dlg').onclick=e=>{ if(e.target.id==='dlg') e.target.classList.remove('on'); };
if(window.preZoom)preZoom();
layoutLinks();
if(window.fitZoom)fitZoom();
window.redraw=function(){preZoom();document.querySelectorAll('.foot').forEach(e=>e.remove());layoutLinks();fitZoom();};
</script></body></html>
