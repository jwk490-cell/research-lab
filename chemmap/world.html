<script>
/* 리서치랩 테마 연동: 상위 사이트의 rl-theme(기본 다크)를 따르고, 토글하면 storage 이벤트로 즉시 반영 */
(function(){var qt=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];function ap(){var t='dark';try{t=localStorage.getItem('rl-theme')||'dark';}catch(e){}if(qt)t=qt;document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
ap();window.addEventListener('storage',function(e){if(e.key==='rl-theme'){ap();if(window.redraw)redraw();}});})();
/* 화면 폭 맞춤: 배율 1에서 배치를 계산한 뒤 캔버스만 축소 (최소 0.55, 그보다 좁으면 가로 스크롤) */
window.preZoom=function(){var c=document.getElementById('canvas');if(c)c.style.zoom=1;};
window.fitZoom=function(){var c=document.getElementById('canvas');if(!c)return;var a=document.documentElement.clientWidth-24;c.style.zoom=Math.max(.55,Math.min(1,a/1640));};
window.addEventListener('resize',function(){window.fitZoom();});
</script>

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif}
.wrap{overflow-x:auto;padding:16px}
#canvas{position:relative;width:1640px;margin:0 auto;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--ring);padding:22px 28px 18px}
h1{margin:0;font-size:26px;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chip{border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;background:var(--card);box-shadow:0 0 0 1px var(--ring);color:var(--ink);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.on{box-shadow:0 0 0 2px var(--ink);font-weight:700}
#map{position:relative;height:820px;margin-top:6px}
#map svg{position:absolute;left:0;top:0}
.call{position:absolute;background:var(--card);border-radius:9px;box-shadow:0 0 0 1px var(--ring),0 2px 6px rgba(0,0,0,.06);padding:7px 10px;font-size:11.5px;line-height:1.5;min-width:150px}
.call .cn{font-weight:800;font-size:14px;margin-bottom:2px}
.call .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.call .r span:first-child{color:var(--ink2)}
.call .r b{font-weight:700}
.call.china{border-top:4px solid var(--cn)}.call.korea{border-top:4px solid var(--kr)}
.call .e{margin-right:3px}
.call .cnt{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:6px}
.call .rows.two{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.call .big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.rg{font-size:9.5px;font-weight:600;color:var(--muted);background:var(--grid);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.leg{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.ramp{display:inline-flex;gap:2px;vertical-align:-2px}.ramp i{width:22px;height:10px;display:inline-block}
.side{position:absolute;left:1010px;top:455px;width:360px;max-height:360px;overflow:auto;z-index:2;background:var(--card);border-radius:10px;box-shadow:0 0 0 1px var(--ring);padding:12px 14px;font-size:12.5px;display:none}
.side.on{display:block}
.side h3{margin:0 0 2px;font-size:17px}
.side table{width:100%;border-collapse:collapse;margin-top:6px}
.side td{padding:3px 4px;border-bottom:1px solid var(--grid)}.side td.n{text-align:right;font-variant-numeric:tabular-nums}
.foot{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}

  const g = svg.append('g');
  panels.forEach(o => {
    const P = D.panels[o.pn], a = proj(P.ll);
    const el = document.createElement('div'); el.className = 'call ' + o.cls; el.innerHTML = o.html;
    el.style.left = P.xy[0] + 'px'; el.style.top = P.xy[1] + 'px'; map.appendChild(el);
    const x = P.xy[0], y = P.xy[1], w = el.offsetWidth, h = el.offsetHeight;
    const bx = Math.max(x, Math.min(x + w, a[0])), by = Math.max(y, Math.min(y + h, a[1]));
    g.append('line').attr('x1', a[0]).attr('y1', a[1]).attr('x2', bx).attr('y2', by).attr('stroke', css('--ink2')).attr('stroke-width', 1).attr('stroke-opacity', .55);
    g.append('circle').attr('cx', a[0]).attr('cy', a[1]).attr('r', 4).attr('fill', css('--ink')).attr('stroke', css('--surface')).attr('stroke-width', 2);
  });
  // 겹침 점검 (디버그용)
  const els = [...map.querySelectorAll('.call'), ...(side.classList.contains('on')?[side]:[])]; window.OVERLAPS = [];
  els.forEach((e,i) => els.slice(i+1).forEach(f => { const A = e.getBoundingClientRect(), B = f.getBoundingClientRect();
    if (A.left < B.right && B.left < A.right && A.top < B.bottom && B.top < A.bottom) OVERLAPS.push((e.querySelector('.cn')||e.querySelector('h3')).textContent.slice(0,8) + '×' + (f.querySelector('.cn')||f.querySelector('h3')).textContent.slice(0,8)); }));
}
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(t => {
  world = topojson.feature(t, t.objects.countries).features.filter(f => f.id !== '010');
  proj.fitExtent([[0, 0], [W, H]], {type: 'FeatureCollection', features: world});
  document.getElementById('foot').innerHTML = '점유율 = 글로벌 생산능력 비중 (천연고무·메탈실리콘은 생산량) · 제품마다 공개 자료 수준이 달라 일부는 "중국/한국/기타"만 확인되고 일부는 추정 · 기준연도·출처는 칩 선택 후 오른쪽 패널 · 원료 기반 색: ' +
    Object.values(D.feeds).map(f => `<b style="color:${f.color}">■</b> ${f.label}`).join('  ');
  draw(); if(window.fitZoom)fitZoom(); document.body.dataset.ready = '1';
});
