<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화학 밸류체인 지도</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script>
(function(){var qt=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];function ap(){var t='dark';try{t=localStorage.getItem('rl-theme')||'dark';}catch(e){}if(qt)t=qt;document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
ap();window.addEventListener('storage',function(e){if(e.key==='rl-theme')ap();});})();
</script>
<style>
:root{--bg:#f2f4f6;--surface:#fff;--line:#e7eaee;--text:#191f28;--sub:#4e5968;--faint:#8b95a1;--accent:#3168f0;--accent-soft:rgba(49,104,240,.08)}
:root[data-theme="dark"]{--bg:#101014;--surface:#1a1b20;--line:#272930;--text:#e9ebee;--sub:#9aa2ad;--faint:#6d7480;--accent:#4d7df5;--accent-soft:rgba(77,125,245,.14)}
*{box-sizing:border-box;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",-apple-system,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 4px}
.bar h1{font-size:16px;margin:0 6px 0 0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font-size:13px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.sp{flex:1}
.dl{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px}
.dl:hover{color:var(--text)}
.note{font-size:11.5px;color:var(--faint);padding:0 16px 6px}
iframe{flex:1;width:100%;border:0;display:block}
</style>
</head>
<body>
<div class="bar">
  <h1>화학 밸류체인 지도</h1>
  <div class="seg" id="seg"><button data-v="chain" class="on">밸류체인 · 용도</button><button data-v="world">글로벌 생산국</button></div>
  <div class="sp"></div>
  <a class="dl" id="dl" href="chemmap/chain.png" download>PNG 저장</a>
</div>
<div class="note">원료 → 기초유분 → 중간체 → 제품, 칸 색 = 원료 기반(원유 전용·가스·중국 석탄·유가 무관) · 국가 점유율은 생산능력 기준, 일부 추정 · 칸·칩을 누르면 출처와 상세</div>
<iframe id="fr" src="chemmap/chain.html" title="화학 밸류체인 지도"></iframe>
<script>
const seg=document.getElementById('seg'),fr=document.getElementById('fr'),dl=document.getElementById('dl');
function go(v){seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  fr.src='chemmap/'+v+'.html'+location.search; dl.href='chemmap/'+v+'.png'; try{localStorage.setItem('rl-chemmap',v);}catch(e){}}
seg.onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v);};
let v0='chain';try{v0=localStorage.getItem('rl-chemmap')||'chain';}catch(e){} if(v0!=='chain')go(v0);
</script>
</body>
</html>
